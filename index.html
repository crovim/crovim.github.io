    <div class="stack-y" style="gap:6px"><span class="eyebrow">${tx('Fraudster-pattern signals in this transaction','Sinais do padrão de fraudador nesta transação')}</span>${FEAT.map(([k,n])=>`<div class="row small" style="gap:8px">${t.f[k]?`<span class="pill bad">${ic('zap',12)} ${tx('match','presente')}</span>`:`<span class="pill neu">${tx('no','não')}</span>`}<span>${n}</span></div>`).join('')}</div></div>
    <div class="callout${d==='app'?' ok':d==='hold'?'':' bad'}">${d==='app'?tx('Score below the hold threshold: the payment goes through in real time.','Score abaixo do limiar de retenção: o pagamento segue em tempo real.'):d==='hold'?tx('Held for up to 30 minutes: the payer must re-authenticate in the app (biometrics) before the money moves.','Retido por até 30 minutos: o pagador precisa se reautenticar no app (biometria) antes de o dinheiro sair.'):tx('Blocked: pattern strongly matches known mule activity; the payer is contacted and the recipient account is reported.','Bloqueado: o padrão bate fortemente com atividade de conta-laranja; o pagador é contatado e a conta recebedora é reportada.')}</div>`});};
  function live(el){
    el.innerHTML=`<div class="grid g4" id="pxK"></div><div class="row between"><div class="chart-title">${tx('Every Pix is scored in under 120 ms; only the riskiest are stopped for re-authentication','Todo Pix é avaliado em menos de 120 ms; só os mais arriscados param para reautenticação')}</div><button class="btn sm" type="button" id="pxRun"></button></div>
      <div class="feed" id="pxFeed"></div><p class="tiny muted">${tx('Synthetic stream · fraud is over-represented here so you can see holds and blocks. Click a transaction for its signals.','Fluxo sintético · fraude está super-representada aqui para você ver retenções e bloqueios. Clique numa transação para ver os sinais.')}</p>`;
    const kp=()=>{$('#pxK',el).innerHTML=[[fint(st.n),tx('scored','avaliadas'),'--fg'],[fint(st.app),tx('approved','aprovadas'),'--ok'],[fint(st.hold),tx('held for re-auth','retidas p/ reaut.'),'--warn'],[`R$ ${fint(st.saved)}`,tx('fraud value stopped','valor de fraude barrado'),'--bad']].map(([v,l,c])=>`<div class="card kpi"><span class="v" style="color:var(${c})">${v}</span><span class="l">${l}</span></div>`).join('');};

    const push=()=>{const t=ML.pixTx(ML.R()<.16);st.feed.unshift(t);st.feed=st.feed.slice(0,7);st.n++;const d=decide(t.score);st[d]++;if(d!=='app'&&t.fraud)st.saved+=t.amt;
      $('#pxFeed',el).innerHTML=st.feed.map(row).join('');$$('[data-tx]',el).forEach(r=>r.onclick=()=>txModal(st.feed[+r.dataset.tx]));kp();};

  function pat(el){

    const lift=FEAT.map(([k,n])=>({k,n,f:sh(F,k),g:sh(G,k)})).sort((a,b)=>b.f/Math.max(b.g,.1)-a.f/Math.max(a.g,.1));
    el.innerHTML=`<div class="grid g2" style="align-items:start"><div class="card pad stack-y" style="gap:6px"><div class="chart-title">${tx(`${lift[0].n.toLowerCase()} is ${fint(lift[0].f/Math.max(lift[0].g,.1))}× more common in fraud than in genuine Pix`,`${lift[0].n.toLowerCase()} é ${fint(lift[0].f/Math.max(lift[0].g,.1))}× mais comum em fraude do que em Pix genuíno`)}</div><div class="chart-sub">${tx('Share of transactions with each signal · fraud vs genuine','Participação de transações com cada sinal · fraude vs genuíno')}</div><div class="chart-box" style="height:300px"><canvas id="pxBars" aria-label="Signals"></canvas></div></div>
      <div class="card pad stack-y" style="gap:6px"><div class="chart-title">${tx('Fraud concentrates at night and at amounts far above the payer’s usual','A fraude se concentra à noite e em valores muito acima do habitual do pagador')}</div><div class="chart-sub">${tx('Hour of day vs amount relative to payer’s median (log scale) · sample of 1,500','Hora do dia vs valor relativo à mediana do pagador (escala log) · amostra de 1.500')}</div><div class="chart-box" style="height:300px"><canvas id="pxSc" aria-label="Scatter"></canvas></div></div></div>
      <div class="card pad stack-y" style="gap:6px"><div class="chart-title">${tx('A mule account in the network: 9 victims in one hour, cashed out to 2 accounts within minutes','Uma conta-laranja na rede: 9 vítimas em uma hora, sacadas para 2 contas em minutos')}</div><div class="chart-sub">${tx('Transaction graph around one flagged recipient · click a node','Grafo de transações em torno de um recebedor sinalizado · clique num nó')}</div><div class="diagram-wrap"><svg id="pxNet" viewBox="0 0 760 320" style="min-width:520px" role="img" aria-label="Mule network"></svg></div></div>`;
    mkChart($('#pxBars',el),{type:'bar',data:{labels:lift.map(x=>x.n),datasets:[{label:tx('Fraud','Fraude'),data:lift.map(x=>x.f),backgroundColor:cssv('--f-prod'),borderRadius:3},{label:tx('Genuine','Genuíno'),data:lift.map(x=>x.g),backgroundColor:cssv('--grey-mark'),borderRadius:3}]},options:{indexAxis:'y',scales:{x:{max:100,ticks:{callback:v=>v+'%'}},y:{grid:{display:false},ticks:{autoSkip:false,font:{size:10.5}}}},plugins:{legend:{display:true,labels:{boxWidth:12}},tooltip:{displayColors:true,callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw,1)}%`}}}}});
    const S=[...F.slice(0,260),...G.slice(0,1240)];
    mkChart($('#pxSc',el),{type:'scatter',data:{datasets:[{label:tx('Genuine','Genuíno'),data:S.filter(p=>!p.fraud).map(p=>({x:p.hour+ML.R()*.9,y:p.mult})),backgroundColor:cssv('--grey-mark'),pointRadius:2},{label:tx('Fraud','Fraude'),data:S.filter(p=>p.fraud).map(p=>({x:p.hour+ML.R()*.9,y:p.mult})),backgroundColor:cssv('--f-prod'),pointRadius:2.6}]},options:{scales:{x:{min:0,max:24,ticks:{stepSize:3,callback:v=>v+'h'},title:{display:true,text:tx('hour','hora')}},y:{type:'logarithmic',min:.1,max:100,title:{display:true,text:tx('× payer’s median','× mediana do pagador')},ticks:{callback:v=>[0.1,1,10,100].includes(v)?v+'×':''}}},plugins:{legend:{display:true,labels:{boxWidth:10}},tooltip:{displayColors:true,callbacks:{label:c=>`${fmt(c.raw.x,0)}h · ${fmt(c.raw.y,1)}×`}},annot:{h:[{v:5,c:cssv('--fg-2'),label:'5×'}]}}},plugins:[annotPlugin]});
    // mule network
    const nodes=[{id:'m',t:'mule',l:tx('Flagged recipient','Recebedor sinalizado')},...[...Array(9)].map((_,i)=>({id:'v'+i,t:'victim',l:`${tx('Payer','Pagador')} ${i+1}`,amt:Math.round(300+ML.R()*2400)})),{id:'c1',t:'cash',l:tx('Cash-out A','Saque A')},{id:'c2',t:'cash',l:tx('Cash-out B','Saque B')},{id:'g1',t:'legit',l:tx('Usual contact','Contato habitual')},{id:'g2',t:'legit',l:tx('Usual contact','Contato habitual')}];
    const W=760,Hh=320, pos={m:[380,160],c1:[620,100],c2:[620,220],g1:[60,40],g2:[60,280]};
    nodes.filter(n=>n.t==='victim').forEach((n,i)=>{const t=-1.0+i*0.25;pos[n.id]=[380-210*Math.cos(t)+(i%2?-28:0),160+125*Math.sin(t)];});
    const tot=nodes.filter(n=>n.t==='victim').reduce((a,n)=>a+n.amt,0);
    let h=''; const C={mule:'--f-prod',victim:'--grey-mark',cash:'--bad',legit:'--ok'};
    nodes.filter(n=>n.t==='victim').forEach(n=>{h+=`<line x1="${pos[n.id][0]}" y1="${pos[n.id][1]}" x2="380" y2="160" stroke="var(--f-prod)" stroke-width="${1+n.amt/900}" opacity=".55"/>`;});
    h+=`<line x1="380" y1="160" x2="620" y2="100" stroke="var(--bad)" stroke-width="4"/><line x1="380" y1="160" x2="620" y2="220" stroke="var(--bad)" stroke-width="3"/><line x1="60" y1="40" x2="${pos.v0[0]}" y2="${pos.v0[1]}" stroke="var(--ok)" stroke-dasharray="4 3"/><line x1="60" y1="280" x2="${pos.v8[0]}" y2="${pos.v8[1]}" stroke="var(--ok)" stroke-dasharray="4 3"/>`;
    nodes.forEach(n=>{const [x,y]=pos[n.id],r=n.t==='mule'?22:n.t==='cash'?16:11;h+=`<g data-nd="${n.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${r}" fill="var(${C[n.t]})" stroke="var(--surface)" stroke-width="2"/><text x="${x}" y="${y+r+13}" text-anchor="middle" font-size="10.5" fill="var(--fg-2)" font-family="var(--font)">${esc(n.l)}${n.amt?` · R$ ${fint(n.amt)}`:''}</text></g>`;});
    $('#pxNet',el).innerHTML=h;
    $$('[data-nd]',el).forEach(g=>g.onclick=()=>{const n=nodes.find(x=>x.id===g.dataset.nd);openModal({eyebrow:tx('Network node · synthetic','Nó da rede · sintético'),title:n.l,html:`<p class="prose">${n.t==='mule'?tx(`Received R$ ${fint(tot)} from 9 different payers in 58 minutes, none of whom had paid this key before. 94% left the account within 12 minutes. Pattern: fan-in → fast cash-out.`,`Recebeu R$ ${fint(tot)} de 9 pagadores diferentes em 58 minutos, nenhum dos quais havia pago essa chave antes. 94% saiu da conta em 12 minutos. Padrão: concentração → saque rápido.`):n.t==='victim'?tx(`Paid R$ ${fint(n.amt)} to a key created hours earlier, at night, from a device first seen today. Under the model, this payment would have been held for re-authentication.`,`Pagou R$ ${fint(n.amt)} para uma chave criada horas antes, à noite, de um dispositivo visto pela primeira vez hoje. Com o modelo, esse pagamento teria sido retido para reautenticação.`):n.t==='cash'?tx('Destination of the fast cash-out. Accounts like this are reported through the Central Bank’s special return mechanism (MED).','Destino do saque rápido. Contas assim são reportadas pelo Mecanismo Especial de Devolução (MED) do Banco Central.'):tx('A usual contact of the payer: normal history, so the edge is green and the model stays silent.','Um contato habitual do pagador: histórico normal, então a aresta é verde e o modelo fica em silêncio.')}</p>`});});
  }
  function cost(el){
    const P=ML.POP, ths=[];for(let t=300;t<=980;t+=20)ths.push(t);
    const fraudVal=P.filter(p=>p.fraud).reduce((a,p)=>a+p.amt,0), nG=P.filter(p=>!p.fraud).length;
    const st2={fr:15};
    el.innerHTML=`<div class="grid g-side" style="align-items:start;grid-template-columns:minmax(0,1fr) 320px"><div class="card pad stack-y" style="gap:6px"><div class="chart-title" id="cT"></div><div class="chart-sub">${tx('Total cost per 24k transactions = fraud that gets through + friction cost of holding genuine payments','Custo total por 24 mil transações = fraude que passa + custo de atrito ao reter pagamentos genuínos')}</div><div class="chart-box" style="height:300px"><canvas id="cC" aria-label="Cost curve"></canvas></div></div>
      <div class="stack-y" style="gap:12px"><div class="card pad stack-y" style="gap:10px"><div class="slider-row"><label for="hThr">${tx('Hold threshold','Limiar de retenção')}</label><output id="oH"></output><input type="range" id="hThr" min="300" max="980" step="20" value="${st.thr}"></div>
        <div class="slider-row"><label for="fCost">${tx('Cost of one wrongful hold (R$)','Custo de uma retenção indevida (R$)')}</label><output id="oF"></output><input type="range" id="fCost" min="2" max="60" step="1" value="${st2.fr}"></div></div>
        <div class="card pad stack-y" style="gap:8px"><div class="listx small" id="cK"></div></div></div></div>`;
    const calc=t=>{const held=P.filter(p=>p.score>=t);const caught=held.filter(p=>p.fraud).reduce((a,p)=>a+p.amt,0);const fh=held.filter(p=>!p.fraud).length;return {caught,miss:fraudVal-caught,fh,cost:fraudVal-caught+fh*st2.fr};};
    const upd=()=>{
      const pts=ths.map(t=>({t,...calc(t)})), best=pts.reduce((a,b)=>b.cost<a.cost?b:a), cur=calc(st.thr);
      $('#oH',el).textContent=st.thr; $('#oF',el).textContent='R$ '+st2.fr;
      $('#cT',el).textContent=Math.abs(best.t-st.thr)<=20?tx(`${st.thr} is at the cost minimum: R$ ${fint(cur.cost)} per 24k Pix`,`${st.thr} está no custo mínimo: R$ ${fint(cur.cost)} por 24 mil Pix`):tx(`Moving the threshold from ${st.thr} to ${best.t} would save R$ ${fint(cur.cost-best.cost)} per 24k Pix`,`Mover o limiar de ${st.thr} para ${best.t} economizaria R$ ${fint(cur.cost-best.cost)} por 24 mil Pix`);
      $('#cK',el).innerHTML=[[tx('Fraud value stopped','Valor de fraude barrado'),pct(100*cur.caught/fraudVal,0)],[tx('Genuine payments held','Pagamentos genuínos retidos'),`${fint(cur.fh)} (${pct(100*cur.fh/nG,2)})`],[tx('Fraud that gets through','Fraude que passa'),'R$ '+fint(cur.miss)],[tx('Friction cost','Custo de atrito'),'R$ '+fint(cur.fh*st2.fr)]].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
      dropCharts(['cC']);
      mkChart($('#cC',el),{type:'line',data:{labels:ths,datasets:[{label:tx('Fraud that gets through','Fraude que passa'),data:pts.map(p=>p.miss),borderColor:cssv('--f-prod'),pointRadius:0,borderWidth:1.8},{label:tx('Friction cost','Custo de atrito'),data:pts.map(p=>p.fh*st2.fr),borderColor:cssv('--grey-mark'),pointRadius:0,borderWidth:1.8},{label:tx('Total cost','Custo total'),data:pts.map(p=>p.cost),borderColor:cssv('--primary'),borderWidth:3,pointRadius:pts.map(p=>p.t===best.t?6:0),pointBackgroundColor:cssv('--primary')}]},
        options:{animation:false,interaction:{mode:'index',intersect:false},scales:{y:{min:0,ticks:{callback:v=>'R$ '+fint(v/1000)+'k'}},x:{title:{display:true,text:tx('hold threshold','limiar de retenção')},grid:{display:false},ticks:{callback:function(v){const l=this.getLabelForValue(v);return l%100===0?l:'';}}}},plugins:{legend:{display:true,labels:{boxWidth:12}},tooltip:{displayColors:true,callbacks:{label:c=>`${c.dataset.label}: R$ ${fint(c.raw)}`}},annot:{v:[{v:ths.indexOf(st.thr),c:cssv('--fg'),dash:[],label:tx('current','atual')}]}}},plugins:[annotPlugin]});
    };
    $('#hThr',el).oninput=e=>{st.thr=+e.target.value;upd();}; $('#fCost',el).oninput=e=>{st2.fr=+e.target.value;upd();}; upd();
  }
  function draw(){ stop(); dropCharts(['pxBars','pxSc','cC']); const el=$('#pxBody',root); ({live,pat,cost})[st.tab](el); }
  draw();
}

CASE_BUILDERS.push(()=>({
  slug:'pix-fraud', status:'prod', order:1, group:'a',
  menu:tx('Real-time fraud model for instant payments','Modelo de fraude em tempo real para pagamentos instantâneos'),
  frame:{type:'web',name:'Pix Shield · real-time decisions',url:'antifraud.vertice-bureau.example/console',meta:tx('p95 latency 118 ms','latência p95 118 ms')},
  demoTitle:tx('Watch every payment get a decision','Veja cada pagamento receber uma decisão'),
  title:tx('Pix Fraud Detection Model','Modelo de Detecção de Fraude no Pix'),
  subtitle:tx('A real-time model that learned the fraudster pattern from historical Pix transfers and holds the riskiest payments until the payer re-authenticates.','Um modelo em tempo real que aprendeu o padrão de fraudadores a partir de transferências Pix históricas e retém os pagamentos mais arriscados até o pagador se reautenticar.'),
  question:tx('Can we stop a fraudulent instant payment in the 120 ms before it leaves, without blocking honest people?','Dá para barrar um pagamento instantâneo fraudulento nos 120 ms antes de ele sair, sem travar pessoas honestas?'),
  proof:['−38%',tx('fraud losses vs the rules-only baseline in a six-month backtest','perdas com fraude vs a linha de base só com regras, em backtest de seis meses'),'finding'],
  fronts:['ds','eng','prod','story'], stack:['Python','PySpark','Databricks','LightGBM'], stackMore:['SQL','MLflow','Feature store','BACEN rules'],
  role:tx('Data scientist · modeling lead','Cientista de dados · líder de modelagem'), time:'2025', org:tx('Vértice Bureau (fictional credit bureau)','Vértice Bureau (birô de crédito fictício)'),
  kpis:[['1.8M',tx('Pix transactions scored per day','transações Pix avaliadas por dia')],['118 ms',tx('p95 decision latency','latência p95 da decisão')],['−38%',tx('fraud losses vs rules-only (backtest)','perdas com fraude vs só regras (backtest)')],['0.6%',tx('of payments held for re-authentication','dos pagamentos retidos para reautenticação')]],
  context:`<p>${tx('Instant payments settle in seconds, so a fraudulent transfer is usually gone before anyone notices. Victims are tricked into paying new keys at night, often to “mule” accounts rented to cash the money out. The existing rules caught some cases but held too many honest payments.','Pagamentos instantâneos liquidam em segundos, então uma transferência fraudulenta normalmente some antes de alguém perceber. Vítimas são enganadas a pagar chaves novas à noite, muitas vezes para contas-laranja alugadas para sacar o dinheiro. As regras existentes pegavam alguns casos, mas retinham pagamentos honestos demais.')}</p>`,
  built:`<p>${tx('A gradient-boosted model trained on historical transfers labelled by confirmed fraud reports. Features describe the payer’s own behaviour (usual amounts, devices, hours), the recipient (key age, account age, how many people paid it recently) and the link between them. Each payment gets a 0–1000 score: below the threshold it flows; above it, it is held until the payer re-authenticates; at the top, it is blocked.','Um modelo de gradient boosting treinado com transferências históricas rotuladas por denúncias de fraude confirmadas. Os atributos descrevem o comportamento do pagador (valores, dispositivos, horários habituais), o recebedor (idade da chave, idade da conta, quantas pessoas o pagaram recentemente) e a relação entre eles. Cada pagamento recebe um score de 0 a 1000: abaixo do limiar segue; acima, fica retido até o pagador se reautenticar; no topo, é bloqueado.')}</p>`,
  flow:flowCols(['Historical Pix transfers','Confirmed fraud reports','Device & session events'],['Feature pipeline (PySpark)','Payer & recipient profiles','Gradient-boosted model','Threshold & cost tuning'],['Real-time score API','Hold / re-auth / block'],['Fraud operations','Payments app','Compliance (BACEN)']),
  demoHint:tx('Live stream of synthetic Pix: click any transaction for its signals · then explore the fraud pattern, the mule network and the cost of each threshold','Fluxo ao vivo de Pix sintéticos: clique numa transação para ver os sinais · depois explore o padrão de fraude, a rede de contas-laranja e o custo de cada limiar'),
  demo:demoPix,
  impact:[[tx('Stop money before it leaves','Barrar o dinheiro antes de sair'),tx('High-risk payments wait for a biometric re-authentication instead of being refunded weeks later.','Pagamentos de alto risco esperam uma reautenticação biométrica em vez de serem estornados semanas depois.')],[tx('See mule networks, not single cases','Ver redes de laranjas, não casos isolados'),tx('Analysts investigate recipients that collect from many victims, which stops many frauds at once.','Analistas investigam recebedores que coletam de muitas vítimas, o que barra várias fraudes de uma vez.')],[tx('Choose the threshold with numbers','Escolher o limiar com números'),tx('Fraud and product agree on one cost curve instead of arguing about false positives.','Fraude e produto concordam numa curva de custo em vez de discutir falsos positivos.')]],
  decisions:[[tx('Hold and re-authenticate before blocking','Reter e reautenticar antes de bloquear'),tx('A biometric check stops most fraud with seconds of friction; outright blocks are reserved for the top of the score.','Uma checagem biométrica barra a maior parte da fraude com segundos de atrito; bloqueios ficam só para o topo do score.')],[tx('Features relative to each payer','Atributos relativos a cada pagador'),tx('R$ 2,000 is normal for one person and alarming for another; ratios to the payer’s median beat absolute amounts.','R$ 2.000 é normal para uma pessoa e alarmante para outra; razões sobre a mediana do pagador vencem valores absolutos.')],[tx('Threshold chosen on cost, not accuracy','Limiar escolhido por custo, não acurácia'),tx('With 1% fraud, accuracy is meaningless; the cost curve makes the trade-off explicit.','Com 1% de fraude, acurácia não significa nada; a curva de custo explicita o trade-off.')],[tx('Explainable signals in every decision','Sinais explicáveis em cada decisão'),tx('Operations and regulators can see why a payment was held.','Operação e reguladores conseguem ver por que um pagamento foi retido.')]],
  rules:`<div class="formula">score   = 1000 × P(fraud | payer profile, recipient profile, context)
decision = score ≥ T + 120 → block · score ≥ T → hold & re-authenticate · ${tx('else','senão')} → approve
${tx('cost(T)','custo(T)')} = ${tx('fraud value missed','valor de fraude perdido')}(T) + ${tx('wrongful holds','retenções indevidas')}(T) × ${tx('cost per hold','custo por retenção')}</div>
    <ul><li>${tx('Labels: transfers reported and confirmed as fraud within 30 days; the most recent 30 days are excluded from training to avoid incomplete labels.','Rótulos: transferências denunciadas e confirmadas como fraude em até 30 dias; os 30 dias mais recentes ficam fora do treino para evitar rótulos incompletos.')}</li><li>${tx('Validation: out-of-time split, then a six-month backtest against the rules engine on the same transactions.','Validação: divisão fora do tempo e depois backtest de seis meses contra o motor de regras nas mesmas transações.')}</li><li>${tx('Monitoring: score distribution and hold rate per day; alerts when drift exceeds agreed bands.','Monitoramento: distribuição do score e taxa de retenção por dia; alertas quando o desvio passa das faixas combinadas.')}</li></ul>`,
  critique:[[tx('Holding a Pix can delay someone’s rent. Is 0.6% acceptable?','Reter um Pix pode atrasar o aluguel de alguém. 0,6% é aceitável?'),tx('Only because most holds clear in under a minute with biometrics. The number I watch is not the hold rate but how many genuine payers abandon the payment; if that rises, the threshold moves.','Só porque a maioria das retenções se resolve em menos de um minuto com biometria. O número que acompanho não é a taxa de retenção, mas quantos pagadores genuínos desistem do pagamento; se isso sobe, o limiar muda.')],[tx('The model learns from reported fraud. What about fraud nobody reported?','O modelo aprende com fraude denunciada. E a fraude que ninguém denunciou?'),tx('It is blind to it, and worse, it learns that those patterns are “genuine”. Network signals such as fan-in to mule accounts help find unreported cases, which are reviewed and fed back as labels.','Ele é cego para ela e, pior, aprende que esses padrões são “genuínos”. Sinais de rede, como concentração em contas-laranja, ajudam a achar casos não denunciados, que são revisados e voltam como rótulos.')],[tx('Does blocking a mule account punish someone who rented it out of need?','Bloquear uma conta-laranja pune alguém que a alugou por necessidade?'),tx('Sometimes, yes. The model’s job is to stop the money; what happens to the account holder is a policy decision that should not be automated.','Às vezes, sim. O trabalho do modelo é parar o dinheiro; o que acontece com o titular da conta é uma decisão de política que não deve ser automatizada.')]],
  results:`<ul><li>${tx('Backtest: 38% less fraud value lost than the rules engine at a similar hold rate.','Backtest: 38% menos valor perdido com fraude que o motor de regras, com taxa de retenção parecida.')}</li><li>${tx('Mule-network features alone explained a large share of the gain, confirming that the recipient side matters as much as the payer.','Só os atributos de rede de laranjas explicaram grande parte do ganho, confirmando que o lado do recebedor importa tanto quanto o do pagador.')}</li></ul><p class="small muted">${tx('Figures in this case are fictionalized for confidentiality.','Os números deste case são ficcionalizados por confidencialidade.')}</p>`,
  lessons:`<ul><li>${tx('Label delay is the hidden enemy: fraud reports arrive weeks later, so the freshest data is the least reliable.','O atraso dos rótulos é o inimigo oculto: denúncias chegam semanas depois, então os dados mais recentes são os menos confiáveis.')}</li><li>${tx('Next: graph features computed in streaming and a challenger model with sequence features.','Próximo: atributos de grafo calculados em streaming e um modelo desafiante com atributos de sequência.')}</li></ul>`
}));

CASE_BUILDERS.push(()=>({
  slug:'auth-score', status:'prod', order:2, group:'a',

  role:tx('Data scientist','Cientista de dados'), time:'2025', org:tx('Vértice Bureau (fictional credit bureau)','Vértice Bureau (birô de crédito fictício)'),

  context:`<p>${tx('Passwords and one-time codes leak. Attackers who have them look like the real user to a simple login check. The question is not “is the password right?” but “does this login look like this person?”','Senhas e códigos únicos vazam. Um atacante que os tem parece o usuário real para uma checagem simples de login. A pergunta não é “a senha está certa?”, mas “este login se parece com esta pessoa?”')}</p>`,
  built:`<p>${tx('A scoring model built from each user’s history: usual devices, places and hours, IP reputation, and how they answered recent authentication challenges. Every login receives a 0–1000 risk score and one of four actions: allow, allow and monitor, step-up with a code and biometrics, or block and require full re-authentication.','Um modelo de score construído a partir do histórico de cada usuário: dispositivos, locais e horários habituais, reputação do IP e como ele respondeu a desafios recentes de autenticação. Todo login recebe um score de 0 a 1000 e uma de quatro ações: permitir, permitir e monitorar, step-up com código e biometria, ou bloquear e exigir reautenticação completa.')}</p>`,
  flow:flowCols(['Login & session events','Device fingerprints','IP & threat feeds','Past auth answers'],['User baseline profiles','Feature engineering','Gradient-boosted classifier','Explanations per login'],['0–1000 risk score','Action by band'],['Identity platform','Fraud analysts','Customers']),
  demoHint:tx('Pick a scenario or change the signals yourself · the gauge, the action and the explanation update live · then test thresholds in “Model performance”','Escolha um cenário ou mude os sinais você mesmo · o medidor, a ação e a explicação atualizam ao vivo · depois teste limiares em “Desempenho do modelo”'),
  demo:demoAuth,
  impact:[[tx('Stop takeovers that have the password','Barrar tomadas de conta que têm a senha'),tx('A stolen credential is no longer enough when the device, place and hour do not fit the owner.','Uma credencial roubada deixa de bastar quando dispositivo, local e horário não combinam com o dono.')],[tx('Leave genuine users alone','Deixar usuários genuínos em paz'),tx('Most logins pass silently, so extra friction is spent only where risk is real.','A maioria dos logins passa sem atrito, então o atrito extra só é gasto onde há risco real.')],[tx('Explain every decision','Explicar cada decisão'),tx('Analysts and support see which signals raised the score, so they can answer a customer in one call.','Analistas e atendimento veem quais sinais subiram o score e respondem o cliente numa ligação.')]],
  decisions:[[tx('Compare users with themselves','Comparar o usuário com ele mesmo'),tx('A 03:00 login is normal for a night-shift nurse; per-user baselines avoid punishing different routines.','Um login às 3h é normal para uma enfermeira do turno da noite; linhas de base por usuário evitam punir rotinas diferentes.')],[tx('Four bands, four actions','Quatro faixas, quatro ações'),tx('A single yes/no threshold forces a bad trade-off; graded actions spend friction where it pays.','Um único limiar sim/não força um trade-off ruim; ações graduais gastam atrito onde compensa.')],[tx('Explanation shipped with the score','Explicação junto com o score'),tx('Per-login contributions make the model auditable and help support teams.','Contribuições por login tornam o modelo auditável e ajudam o atendimento.')]],
  rules:`<div class="formula">score = 1000 × σ( β0 + Σ βᵢ · signalᵢ )
${tx('bands','faixas')}  0–199 allow · 200–499 allow + monitor · 500–799 step-up (code + biometrics) · 800+ block & full re-authentication
${tx('unusual hour','horário incomum')} = −log( P(user logs in at h) × 24 )   ${tx('distance','distância')} = log₁₀(1 + km / 10)   ${tx('impossible travel','viagem impossível')} = km / h > 900</div>`,
  critique:[[tx('Who pays for a false alarm?','Quem paga por um alarme falso?'),tx('The genuine user, in time and trust. I set a friction budget with product (how many challenges per thousand logins we accept) before choosing any threshold.','O usuário genuíno, em tempo e confiança. Defini com produto um orçamento de atrito (quantos desafios por mil logins aceitamos) antes de escolher qualquer limiar.')],[tx('Is the score fair to people on shared networks?','O score é justo com quem usa redes compartilhadas?'),tx('Not automatically. Carrier NAT and shared IPs raise risk for whole regions, so I monitor challenge rates by segment and cap the weight of IP reputation.','Não automaticamente. NAT de operadora e IPs compartilhados elevam o risco de regiões inteiras, então monitoro a taxa de desafios por segmento e limito o peso da reputação de IP.')],[tx('What happens when attackers learn the model?','O que acontece quando os atacantes aprendem o modelo?'),tx('They adapt: residential proxies, aged devices. Drift monitoring and a challenger model retrained monthly are part of the product, not an afterthought.','Eles se adaptam: proxies residenciais, dispositivos envelhecidos. Monitoramento de desvio e um modelo desafiante retreinado todo mês fazem parte do produto, não são um detalhe.')]],
  results:`<ul><li>${tx('AUC 0.94 on an out-of-time holdout; at the critical threshold about 1 in 90 genuine logins is challenged.','AUC 0,94 num holdout fora do tempo; no limiar crítico cerca de 1 em 90 logins genuínos é desafiado.')}</li><li>${tx('New device and impossible travel were the strongest single signals; failed recent codes added most when combined with them.','Dispositivo novo e viagem impossível foram os sinais isolados mais fortes; códigos recentes errados somaram mais quando combinados com eles.')}</li></ul><p class="small muted">${tx('Figures in this case are fictionalized for confidentiality.','Os números deste case são ficcionalizados por confidencialidade.')}</p>`,
  lessons:`<ul><li>${tx('The hardest part was not the model but agreeing what each band should do; that conversation is product design.','A parte mais difícil não foi o modelo, mas combinar o que cada faixa deve fazer; essa conversa é design de produto.')}</li><li>${tx('Next: sequence features across sessions and passkey adoption as a risk-reducing signal.','Próximo: atributos de sequência entre sessões e adoção de passkeys como sinal redutor de risco.')}</li></ul>`
}));
/* ================================ INIT ==================================== */
(function init(){
  if(window.Chart) Chart.register(annotPlugin);
  $$('#langSeg button').forEach(b=>b.onclick=()=>{ if(LANG===b.dataset.lang) return; LANG=b.dataset.lang; route(false); toast(LANG==='pt'?'Idioma: Português':'Language: English'); });
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':mq.matches;};
  $('#themeBtn').onclick=()=>{document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');route(false);};
  try{ mq.addEventListener('change',()=>{ if(!document.documentElement.getAttribute('data-theme')) route(false); }); }catch(e){}
  $('#modalClose').onclick=closeModal;
  $('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modalBg').hidden) closeModal(); });
  window.addEventListener('hashchange',()=>route(true));
  if(!window.Chart||!window.d3){ console.warn('Chart.js or D3 failed to load'); }
  route(true);
  setTimeout(()=>$('#loader').classList.add('done'),380);
  setTimeout(()=>$('#loader').remove(),800);
})();

</script>
