<style>
/* Layout: sticky nav · single 1240px column · hash-routed views (home, fronts, case-*, about) · cards only where an object needs separating */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#E9EEF5;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --fg:#1E293B; --fg-2:#334155; --muted:#64748B; --faint:#94A3B8;
  --primary:#0086FF; --primary-ink:#0069C9; --primary-tint:rgba(0,134,255,.10);
  --on-primary:#FFFFFF;
  --grey-mark:#CBD5E1; --grey-mark-2:#E2E8F0;
  --up:#0086FF; --down:#EA6A12;
  --ok:#15803D; --ok-bg:#DCFCE7; --warn:#A15C07; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2; --neu:#475569; --neu-bg:#EEF2F6;
  --f-eng:#0B1F4B; --f-eng-ink:#0B1F4B;
  --f-ae:#3B3FB6;  --f-ae-ink:#3B3FB6;
  --f-prod:#D6246E;--f-prod-ink:#B81C5D;
  --f-ds:#F2B705;  --f-ds-ink:#8A6400;
  --f-gov:#19B36B; --f-gov-ink:#0E7A47;
  --f-strat:#7A3FF2;--f-strat-ink:#6A2FE0;
  --f-story:#00A8C6;--f-story-ink:#00788D;
  --f-ux:#64748B;  --f-ux-ink:#475569;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --scrim:rgba(15,23,42,.45);
  --font:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --r:12px;
  --grid-line:rgba(15,23,42,.045);
  --navy:#0B1F4B; --navy-2:#13306B; --on-navy:#F1F5FF; --on-navy-2:#A9B8DA; --sheet-head:#F3F5F8; --sheet-sel:rgba(0,134,255,.12); --slide:#FFFFFF; --grid-dot:rgba(15,23,42,.09);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A101C; --surface:#111A2A; --surface-2:#172236; --surface-3:#1D2A42;
  --border:#22304A; --border-strong:#33445F;
  --fg:#E5EAF2; --fg-2:#C9D2DF; --muted:#94A3B8; --faint:#64748B;
  --primary:#3BA3FF; --primary-ink:#7CC1FF; --primary-tint:rgba(59,163,255,.14); --on-primary:#06192E;
  --grey-mark:#3A4A64; --grey-mark-2:#2A3850;
  --up:#3BA3FF; --down:#FF8A3D;
  --ok:#4ADE80; --ok-bg:rgba(34,197,94,.15); --warn:#FBBF24; --warn-bg:rgba(245,158,11,.15); --bad:#F87171; --bad-bg:rgba(239,68,68,.15); --neu:#B6C2D2; --neu-bg:rgba(148,163,184,.14);
  --f-eng:#7E97E0; --f-eng-ink:#A9BBF0; --f-ae:#8C8FF2; --f-ae-ink:#B3B5FA; --f-prod:#F2609A; --f-prod-ink:#F78DB7;
  --f-ds:#F2B705; --f-ds-ink:#F5CD4D; --f-gov:#3CCB86; --f-gov-ink:#6FDCA6; --f-strat:#A783FF; --f-strat-ink:#C2A9FF;
  --f-story:#2CC3DE; --f-story-ink:#6AD8EB; --f-ux:#94A3B8; --f-ux-ink:#B6C2D2;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 20px 50px rgba(0,0,0,.55); --scrim:rgba(2,6,15,.66);
  --navy:#0E2149; --navy-2:#173062; --on-navy:#EEF3FF; --on-navy-2:#9FB0D6; --sheet-head:#152036; --sheet-sel:rgba(59,163,255,.18); --slide:#111A2A; --grid-line:rgba(148,163,184,.07); --grid-dot:rgba(148,163,184,.10);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A101C; --surface:#111A2A; --surface-2:#172236; --surface-3:#1D2A42;
  --border:#22304A; --border-strong:#33445F;
  --fg:#E5EAF2; --fg-2:#C9D2DF; --muted:#94A3B8; --faint:#64748B;
  --primary:#3BA3FF; --primary-ink:#7CC1FF; --primary-tint:rgba(59,163,255,.14); --on-primary:#06192E;
  --grey-mark:#3A4A64; --grey-mark-2:#2A3850;
  --up:#3BA3FF; --down:#FF8A3D;
  --ok:#4ADE80; --ok-bg:rgba(34,197,94,.15); --warn:#FBBF24; --warn-bg:rgba(245,158,11,.15); --bad:#F87171; --bad-bg:rgba(239,68,68,.15); --neu:#B6C2D2; --neu-bg:rgba(148,163,184,.14);
  --f-eng:#7E97E0; --f-eng-ink:#A9BBF0; --f-ae:#8C8FF2; --f-ae-ink:#B3B5FA; --f-prod:#F2609A; --f-prod-ink:#F78DB7;
  --f-ds:#F2B705; --f-ds-ink:#F5CD4D; --f-gov:#3CCB86; --f-gov-ink:#6FDCA6; --f-strat:#A783FF; --f-strat-ink:#C2A9FF;
  --f-story:#2CC3DE; --f-story-ink:#6AD8EB; --f-ux:#94A3B8; --f-ux-ink:#B6C2D2;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 20px 50px rgba(0,0,0,.55); --scrim:rgba(2,6,15,.66);
  --navy:#0E2149; --navy-2:#173062; --on-navy:#EEF3FF; --on-navy-2:#9FB0D6; --sheet-head:#152036; --sheet-sel:rgba(59,163,255,.18); --slide:#111A2A; --grid-line:rgba(148,163,184,.07); --grid-dot:rgba(148,163,184,.10);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--primary-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{color:var(--fg);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,1.5rem + 2.4vw,3.2rem);line-height:1.05;font-weight:800;letter-spacing:-.03em}
h2{font-size:1.45rem;line-height:1.2;font-weight:700}
h3{font-size:1.08rem;line-height:1.3;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
.lede{font-size:1.12rem;color:var(--fg-2);max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.84rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.prose{max-width:68ch;color:var(--fg-2)} .prose p+p{margin-top:.7em}
.prose ul,.ul{margin:.4em 0 0;padding-left:1.15em;color:var(--fg-2)} .prose li+li,.ul li+li{margin-top:.3em}
code,.mono{font-family:var(--mono);font-size:.86em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack-y{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 300px}
.g-side-l{grid-template-columns:280px minmax(0,1fr)}
@media (max-width:1024px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side,.g-side-l{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.grid>*,.section>*,.stack-y>*,.demo-body>*,.hero>*,.view>*,.case-head>*{min-width:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--border)}
.nav .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:700;margin-right:auto}
.brand:hover{text-decoration:none}
.logo{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.74rem;line-height:1.1}
.navlinks{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.navlink{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap}
.navlink:hover{color:var(--fg);background:var(--surface-2);text-decoration:none}
.navlink.active{color:var(--fg);background:var(--surface-2)}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-2);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
@media (max-width:640px){.brand small{display:none}.nav .wrap{gap:8px}.navlinks{order:3;width:100%}}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{height:30px;padding:0 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:6px;font:inherit;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
select,input[type=number],input[type=text],input[type=search]{font:inherit;font-size:.88rem;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);max-width:100%}
input[type=range]{accent-color:var(--primary);width:100%}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
label.field{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px} .pad-s{padding:14px}
.kpi{padding:16px 18px;display:grid;gap:2px}
.kpi .v{font-size:1.85rem;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--fg);line-height:1.15}
.kpi .l{color:var(--muted);font-size:.82rem}
.kpi .s{font-size:.78rem;font-weight:600}
.kpi .pill{justify-self:start}
.panel{background:var(--surface-2);border-radius:10px;padding:14px}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:650;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--ci);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.lg{font-size:.84rem;padding:7px 13px}
button.chip{border:1.5px solid transparent;cursor:pointer;font-family:inherit}
button.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
button.chip.all{--c:var(--muted);--ci:var(--fg-2)}
.stk{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:2px 7px;border:1px solid var(--border);border-radius:6px;color:var(--fg-2);background:var(--surface);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:650;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neu{background:var(--neu-bg);color:var(--neu)} .pill.info{background:var(--primary-tint);color:var(--primary-ink)}
.tag-personal{background:var(--surface-3);color:var(--fg-2)}

/* tables */
.tblwrap{overflow-x:auto;border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-weight:650;color:var(--muted);background:var(--surface-2);padding:8px 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tbl td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.sortable{cursor:pointer;user-select:none} .tbl th.sortable:hover{color:var(--fg)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.up{color:var(--ok);font-weight:650} .down{color:var(--bad);font-weight:650}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.tab{padding:10px 13px;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font:inherit;font-size:.86rem;font-weight:650;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--primary-ink);border-color:var(--primary)}

/* page bits */
main{padding-block:28px 64px;min-height:70vh}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
.section{display:grid;gap:14px;margin-top:40px}
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:12px 8px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hero-kpis .kpi .v{font-size:2rem}
.how{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.how>div{padding:14px 16px;border-right:1px solid var(--border);display:grid;gap:4px;align-content:start}
.how>div:last-child{border-right:0}
.how b{font-size:.9rem;color:var(--fg)} .how span{font-size:.8rem;color:var(--muted)}
@media (max-width:1024px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.how>div{border-bottom:1px solid var(--border)}}
@media (max-width:560px){.how{grid-template-columns:minmax(0,1fr)}.how>div{border-right:0}}
.case-card{display:flex;flex-direction:column;gap:10px;padding:18px;position:relative;color:inherit;transition:border-color .15s,transform .15s}
.case-card:hover{text-decoration:none;border-color:var(--border-strong);transform:translateY(-2px)}
.case-card h3{padding-right:70px}
.case-card .out{color:var(--fg-2);font-size:.9rem;flex:1}
.ribbon{position:absolute;top:14px;right:14px;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--fg);color:var(--bg)}
.ribbon.personal{background:var(--surface-3);color:var(--fg-2)}
.casenum{font-family:var(--mono);font-size:.74rem;color:var(--faint)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.mcell{width:26px;height:26px;border-radius:6px;display:inline-block;border:0;cursor:pointer;vertical-align:middle}
.mcell.p{background:var(--c)} .mcell.s{background:color-mix(in srgb,var(--c) 30%,transparent)} .mcell.n{background:var(--surface-2);cursor:default}
.matrix th.rot{font-size:.68rem;white-space:normal;min-width:74px;line-height:1.2;text-transform:none;letter-spacing:0}

/* case page */
.crumb{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--fg)}
.case-head{display:grid;gap:14px;margin-top:14px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:6px}
.meta>div{padding:12px 14px 12px 0;display:grid;gap:3px}
.meta dt{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta dd{margin:0;font-weight:600;font-size:.9rem}
@media (max-width:760px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.demo{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.demo-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.demo-body{padding:18px;display:grid;gap:18px}
.synth{display:inline-flex;gap:6px;align-items:center;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.synth::before{content:"";width:8px;height:8px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--warn) 0 2px,transparent 2px 4px)}
.decision{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1.3fr);gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--border)}
.decision:first-child{border-top:0}
.decision b{color:var(--fg)} .decision .arr{color:var(--primary);font-weight:800;text-align:center}
.decision span{color:var(--fg-2)}
@media (max-width:640px){.decision{grid-template-columns:minmax(0,1fr)}.decision .arr{display:none}}
.formula{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--fg)}
.prevnext{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}
.prevnext a{display:grid;gap:4px;padding:16px 18px;color:inherit}
.prevnext a:hover{text-decoration:none;border-color:var(--border-strong)}
.prevnext .nx{text-align:right}
.chart-box{position:relative;width:100%}
.chart-title{font-size:1rem;font-weight:700;color:var(--fg);text-wrap:balance}
.chart-sub{font-size:.8rem;color:var(--muted)}
.diagram-wrap{overflow-x:auto}
.diagram-wrap svg{display:block;min-width:720px;width:100%;height:auto}
.dg-box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1}
.dg-box.me{fill:var(--primary-tint);stroke:var(--primary)}
.dg-t{fill:var(--fg);font-family:var(--font);font-size:12.5px;font-weight:500}
.dg-h{fill:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-arrow{fill:var(--faint)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 14px;border-radius:10px;background:var(--primary-tint);color:var(--fg-2);font-size:.85rem}
.banner b{color:var(--fg)}

function dropCharts(ids){const k=[];CHARTS=CHARTS.filter(c=>{const hit=c.canvas&&ids.includes(c.canvas.id);if(hit)k.push(c);return !hit&&!!c.canvas;});k.forEach(c=>{try{c.destroy()}catch(e){}});}

function killCharts(list){list.forEach(c=>{try{c.destroy()}catch(e){}});list.length=0;}

const annotPlugin={id:'annot',beforeDatasetsDraw(ch,args,o){if(!o)return;const {ctx,chartArea:a,scales}=ch;const font=cssv('--font');ctx.save();
  (o.band||[]).forEach(b=>{const x1=scales.x.getPixelForValue(b.from)-(b.pad||0),x2=scales.x.getPixelForValue(b.to)+(b.pad||0);ctx.fillStyle=b.c;ctx.fillRect(x1,a.top,x2-x1,a.bottom-a.top);if(b.label){ctx.fillStyle=cssv('--muted');ctx.font=`600 10.5px ${font}`;ctx.textAlign='left';ctx.fillText(b.label,x1+6,a.top+12);}});
  ctx.restore();},afterDatasetsDraw(ch,args,o){
  if(!o) return; const {ctx,chartArea:a,scales}=ch; const font=cssv('--font');
  ctx.save();
  (o.h||[]).forEach(l=>{const y=scales[l.axis||'y'].getPixelForValue(l.v);if(y<a.top-1||y>a.bottom+1)return;ctx.strokeStyle=l.c;ctx.setLineDash(l.dash||[5,4]);ctx.lineWidth=l.w||1.5;ctx.beginPath();ctx.moveTo(a.left,y);ctx.lineTo(a.right,y);ctx.stroke();
    if(l.label){ctx.setLineDash([]);ctx.fillStyle=l.c;ctx.font=`650 11px ${font}`;ctx.textAlign='right';ctx.fillText(l.label,a.right-4,y-5);}});
  (o.v||[]).forEach(l=>{const x=scales[l.axis||'x'].getPixelForValue(l.v);if(x<a.left-1||x>a.right+1)return;ctx.strokeStyle=l.c;ctx.setLineDash(l.dash||[5,4]);ctx.lineWidth=l.w||1.5;ctx.beginPath();ctx.moveTo(x,a.top);ctx.lineTo(x,a.bottom);ctx.stroke();
    if(l.label){ctx.setLineDash([]);ctx.fillStyle=l.c;ctx.font=`650 11px ${font}`;ctx.textAlign=l.align||'left';ctx.fillText(l.label,x+(l.align==='right'?-5:5),a.top+12);}});
  if(o.labels){ch.data.datasets.forEach((ds,di)=>{if(!ds.labels)return;ch.getDatasetMeta(di).data.forEach((pt,i)=>{const lab=ds.labels[i];if(!lab)return;ctx.fillStyle=cssv('--fg-2');ctx.font=`600 10.5px ${font}`;ctx.textAlign='left';ctx.fillText(lab,pt.x+8,pt.y+4);});});}
  ctx.restore();
}};

let modalReturn=null;
function openModal({eyebrow='',title='',html='',onOpen}){
  $('.modal').classList.remove('wide');
  killCharts(MCHARTS);
  modalReturn=document.activeElement;
  $('#modalEyebrow').textContent=eyebrow; $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html;
  $('#modalBg').hidden=false; $('#modalClose').focus();
  if(onOpen) onOpen($('#modalBody'));
}
function closeModal(){ $('#modalBg').hidden=true; killCharts(MCHARTS); if(modalReturn&&modalReturn.focus) modalReturn.focus(); }
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},2600);}
function copyText(text,okMsg){
  const done=()=>toast(okMsg||tx('Copied','Copiado'));
  try{ navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); }catch(e){fallback();}
  function fallback(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast(text);}ta.remove();}
}

/* ---- sortable tables ---- */
function sortableTable(el,cols,rows,opts={}){
  // cols: [{k,label,num,fmt(row)}]; rows: array of objects
  let sk=opts.sortKey||null, sd=opts.sortDir||-1;
  function draw(){
    const rs=[...rows]; if(sk){const c=cols.find(c=>c.k===sk);rs.sort((a,b)=>{const va=c.sv?c.sv(a):a[sk],vb=c.sv?c.sv(b):b[sk];if(va==null)return 1;if(vb==null)return -1;return (va>vb?1:va<vb?-1:0)*sd;});}
    el.innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="sortable${c.num?' num':''}" data-k="${c.k}" scope="col" tabindex="0" aria-sort="${sk===c.k?(sd>0?'ascending':'descending'):'none'}">${esc(c.label)}${sk===c.k?(sd>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr${opts.rowAttr?opts.rowAttr(r):''}>${cols.map(c=>`<td class="${c.num?'num':''}">${c.fmt?c.fmt(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    $$('th.sortable',el).forEach(th=>{const go=()=>{const k=th.dataset.k;if(sk===k)sd=-sd;else{sk=k;sd=-1;}draw();};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
    if(opts.onDraw) opts.onDraw(el);
  }
  draw();
}

/* ---- architecture flow diagram (sources → processing → outputs → consumers) ---- */
function flowSVG(cols,aria){
  const W=960,colW=200,gap=(W-colW*4)/3,bh=36,bg=10,top=34;
  const maxN=Math.max(...cols.map(c=>c.items.length)), H=top+maxN*(bh+bg)+6;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria||'Architecture diagram')}">`;
  cols.forEach((c,i)=>{
    const x=i*(colW+gap);
    s+=`<text class="dg-h" x="${x}" y="16">${esc(c.h.toUpperCase())}</text>`;
    const off=(maxN-c.items.length)*(bh+bg)/2;
    c.items.forEach((it,j)=>{const y=top+off+j*(bh+bg);s+=`<rect class="dg-box${c.me?' me':''}" x="${x+.5}" y="${y+.5}" width="${colW-1}" height="${bh}" rx="8"/><text class="dg-t" x="${x+12}" y="${y+bh/2+4.5}">${esc(it)}</text>`;});
    if(i<cols.length-1){const ax=x+colW+9,aw=gap-18,ay=top+(maxN*(bh+bg)-bg)/2;s+=`<path class="dg-arrow" d="M${ax} ${ay-5}H${ax+aw-10}V${ay-11}L${ax+aw} ${ay}L${ax+aw-10} ${ay+11}V${ay+5}H${ax}Z"/>`;}
  });
  return s+'</svg>';
}

/* ---- nav with Cases menu (fixed, outside the scroll strip) ---- */
function ensureMenu(){
  let m=$('#casesMenu'); if(!m){m=document.createElement('div');m.id='casesMenu';m.className='menu';m.setAttribute('role','menu');m.hidden=true;document.body.appendChild(m);} return m;
}
function placeMenu(){
  const m=$('#casesMenu'),b=$('#casesBtn'); if(!m||!b||m.hidden) return;
  const r=b.getBoundingClientRect(), nav=$('.nav').getBoundingClientRect(), w=Math.min(600,window.innerWidth-32);
  m.style.width=w+'px'; m.style.top=(nav.bottom+6)+'px';
  m.style.left=Math.max(16,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-16))+'px'; m.style.right='auto';
}
function renderNav(route){
  const cases=getCases();
  const item=(c)=>`<a href="#case-${c.slug}" class="${route==='case-'+c.slug?'cur':''}" role="menuitem"><b>${num2(c.num)} · ${esc(c.title)}</b><span>${esc(c.menu||'')}</span></a>`;
  $('#navlinks').innerHTML=`<a class="navlink${route==='home'?' active':''}" href="#home">${tx('Home','Início')}</a>
    <button type="button" class="navlink${route.startsWith('case-')?' active':''}" id="casesBtn" aria-haspopup="true" aria-expanded="false" aria-controls="casesMenu" style="border:0;background:none;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center">${tx('Cases','Cases')} <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <a class="navlink${route==='fronts'?' active':''}" href="#fronts">${tx('Data fronts','Frentes de dados')}</a>
    <a class="navlink${route==='about'?' active':''}" href="#about">${tx('About','Sobre')}</a>`;
  const menu=ensureMenu(); menu.hidden=true;
  menu.innerHTML=`<div class="grp"><h5>${tx('Machine learning & data science','Machine learning & ciência de dados')}</h5>${cases.filter(c=>c.group==='a').map(item).join('')}</div>
    <div class="grp"><h5>${tx('Data platforms, engineering & strategy','Plataformas de dados, engenharia & estratégia')}</h5>${cases.filter(c=>c.group!=='a').map(item).join('')}</div>
    <div class="all"><button type="button" class="btn sm ghost" id="menuIndex">${ic('layers',15)} ${tx('Compare all cases side by side','Comparar todos os cases lado a lado')} →</button></div>`;
  const btn=$('#casesBtn');
  const close=()=>{menu.hidden=true;btn.setAttribute('aria-expanded','false');};
  btn.onclick=e=>{e.stopPropagation();const open=menu.hidden;menu.hidden=!open;btn.setAttribute('aria-expanded',String(open));if(open){placeMenu();$('a',menu)?.focus();}};
  menu.onclick=e=>{if(e.target.closest('a'))close();};
  $('#menuIndex').onclick=()=>{close();openIndex();};
  menu.onkeydown=e=>{if(e.key==='Escape'){close();btn.focus();}};
  $('#brandRole').textContent=tx('Senior Data Engineer · Security & ML','Engenheiro de Dados Sênior · Segurança & ML');
  $$('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  document.documentElement.lang=LANG==='pt'?'pt-BR':'en';
  $('#footer').innerHTML=`<span>© 2026 Clovis Junior · ${tx('Case demos use synthetic data; company and people names inside work cases are fictional.','Os demos usam dados sintéticos; nomes de empresas e pessoas nos cases de trabalho são fictícios.')}</span>
   <span class="row"><a href="${ME.linkedin}" target="_blank" rel="noopener">LinkedIn</a><span>·</span><a href="${ME.github}" target="_blank" rel="noopener">GitHub</a><span>·</span><button type="button" class="linkish" data-contact>${tx('Contact','Contato')}</button></span>`;
}

  openModal({eyebrow:`${num2(c.num)} · ${typeLabel(c)}`,title:c.title,html:`
    <p class="lede" style="font-size:1rem">${esc(c.subtitle)}</p>
    <div class="row">${statusPill(c.status)}${c.fronts.map(f=>chip(f,false,true,true)).join('')}</div>
    <div class="panel stack-y" style="gap:4px"><span class="eyebrow">${tx('The question behind it','A pergunta por trás')}</span><p style="font-weight:600;color:var(--fg)">${esc(c.question)}</p></div>

function sparkSVG(vals,color='var(--primary)'){
  const mn=Math.min(...vals),mx=Math.max(...vals),w=200,h=22,pts=vals.map((v,i)=>`${(i*w/(vals.length-1)).toFixed(1)},${(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/><circle cx="${w}" cy="${pts.at(-1).split(',')[1]}" r="2.5" fill="${color}"/></svg>`;
}

/* ===================== CASE 1 · Security Performance Platform ===================== */
const PERF=(()=>{
  const P=DATA.perf, NC=P.CONTROLS.length, clamp=DATA.clamp;
  const valid=r=>r==='NA'||(typeof r==='number'&&r>=0&&r<=100);
  function eff(bu,ci,m){
    const arr=P.ledger[bu][ci], raw=arr[m];
    if(raw==='NA') return {v:100,flag:'na',raw};
    if(valid(raw)) return {v:raw,flag:null,raw};
    for(let k=m-1;k>=0;k--){ if(valid(arr[k])) return {v:arr[k]==='NA'?100:arr[k],flag:raw===''?'locf':'invalid',raw}; }
    return {v:null,flag:raw===''?'locf':'invalid',raw};
  }
  function score(bu,m,w){let s=0,ws=0;for(let i=0;i<NC;i++){const e=eff(bu,i,m);const wi=w?w[i]:1;if(e.v==null||!wi)continue;s+=e.v*wi;ws+=wi;}return ws?s/ws:null;}
  function ctrlProj(bu,ci){const a=eff(bu,ci,P.NM-1).v,b=eff(bu,ci,P.NM-4).v;if(a==null)return null;if(b==null)return a;return clamp(a+2*(a-b)/3,0,100);}
  function buProj(bu,w,boost=0,sel){let s=0,ws=0;for(let i=0;i<NC;i++){let p=ctrlProj(bu,i);const wi=w?w[i]:1;if(p==null||!wi)continue;if(boost&&sel&&sel.has(i))p=Math.min(100,p+boost);s+=p*wi;ws+=wi;}return ws?s/ws:null;}
  const grp=(ids,m,w)=>mean(ids.map(b=>score(b,m,w)).filter(v=>v!=null));
  const grpProj=(ids,w,boost,sel)=>mean(ids.map(b=>buProj(b,w,boost,sel)).filter(v=>v!=null));
  function native(bu,m,bug){const nums=[];for(let i=0;i<NC;i++){if(bug&&i===NC-1)continue;const r=P.ledger[bu][i][m];if(typeof r==='number')nums.push(r);}return mean(nums);}
  const ledgerReported=(bu,m)=>native(bu,m,P.LEDGER_RANGE_BUG.has(bu));
  const disp=r=>r==='NA'?'N/A':r===''?'—':r+'%';
  const quad=(x,y)=>x>=P.TARGET?(y>=0?'strong':'watch'):(y>=0?'recover':'act');
  function ctrlProjK(bu,ci,k){const a=eff(bu,ci,P.NM-1).v,b=eff(bu,ci,P.NM-4).v;if(a==null)return null;if(b==null)return a;return clamp(a+k*2*(a-b)/3,0,100);}
  const buProjK=(bu,k)=>mean([...Array(NC)].map((_,i)=>ctrlProjK(bu,i,k)).filter(v=>v!=null));
  const grpProjK=(ids,k)=>mean(ids.map(b=>buProjK(b,k)));
  return {eff,score,ctrlProj,buProj,grp,grpProj,native,ledgerReported,disp,quad,NC,ctrlProjK,buProjK,grpProjK};
})();

      ${P.USERS.filter(u=>u.role!=='admin').map((u,i)=>`<tr><td>${esc(u.name)}</td><td class="mono small">${esc(u.email)}</td><td><span class="pill ${u.role==='exec'?'info':u.role==='execbu'?'warn':'neu'}">${ROLE_LABEL[u.role]}</span></td><td class="small">${u.bus.map(b=>esc(busById[b].name)).join(', ')||tx('all (aggregate)','todas (agregado)')}</td><td><button class="btn sm" type="button" data-as="${esc(u.email)}">${tx('View as','Ver como')}</button></td></tr>`).join('')}

/* ===================== CASE 2 · Data Atlas ===================== */
function demoAtlas(root){
  const A=DATA.atlas, byId=Object.fromEntries(A.nodes.map(n=>[n.id,n]));
  const TYPES={source:[tx('Source','Fonte'),'--f-story'],pipeline:[tx('Pipeline','Pipeline'),'--f-eng'],base:[tx('Base','Base'),'--f-ae'],indicator:[tx('Indicator','Indicador'),'--f-ds'],output:[tx('Report / product','Relatório / produto'),'--f-prod']};
  const LAYER={source:0,pipeline:1,base:2,indicator:3,output:4}; const OVR={o_deck:5,o_report:6};
  let sel='o_platform', full=true;
  const tasks=A.tasks.map(t=>({...t}));
  root.innerHTML=`
    <div class="grid g-side" style="align-items:start">
      <div class="card pad-s stack-y" style="gap:8px">
        <div class="row between"><div class="chart-title" id="atTitle"></div><label class="row small" style="gap:6px"><input type="checkbox" id="atFull" checked> ${tx('Full lineage','Linhagem completa')}</label></div>
        <div class="row small">${Object.entries(TYPES).map(([k,[n,c]])=>`<span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(${c})"></span>${n}</span>`).join('')}<span class="row" style="gap:5px;margin-left:8px"><span style="width:16px;height:3px;background:var(--up)"></span>${tx('upstream','upstream')}</span><span class="row" style="gap:5px"><span style="width:16px;height:3px;background:var(--down)"></span>${tx('downstream','downstream')}</span></div>
        <div class="diagram-wrap"><svg id="atSvg" viewBox="0 0 860 470" role="img" aria-label="${tx('Lineage graph','Grafo de linhagem')}" style="min-width:640px"></svg></div>
        <p class="tiny muted">${tx('Click a node to trace it · drag to rearrange','Clique num nó para rastrear · arraste para reorganizar')}</p>
      </div>
      <div class="card pad stack-y" id="atPanel" style="gap:10px"></div>
    </div>
    <div class="grid g2" style="align-items:start">
      <div class="stack-y" style="gap:8px"><div class="row between"><h4>${tx('Task board','Quadro de tarefas')}</h4><form class="row" id="kAdd" style="gap:6px"><input type="text" id="kNew" placeholder="${tx('Quick add…','Adicionar rápido…')}" aria-label="${tx('New task','Nova tarefa')}"><button class="btn sm" type="submit">${tx('Add','Adicionar')}</button></form></div><div class="kanban" id="kb"></div></div>
      <div class="stack-y" style="gap:8px"><div class="row between"><h4>${tx('Data dictionary · AppSec treated base','Dicionário de dados · base tratada AppSec')}</h4><button class="btn sm" type="button" id="scanBtn">${tx('Re-scan (read-only)','Reescanear (somente leitura)')}</button></div><div id="dict"></div><div class="row" id="scanOut"></div></div>
    </div>`;

  // graph layout
  const W=860,H=470, nodes=A.nodes.map(n=>({...n,layer:OVR[n.id]??LAYER[n.t]})), links=A.links.map(([s,t])=>({source:s,target:t}));
  const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(80).strength(.35)).force('charge',d3.forceManyBody().strength(-280))
    .force('x',d3.forceX(d=>58+d.layer*(W-120)/6).strength(1)).force('y',d3.forceY(H/2).strength(.07)).force('collide',d3.forceCollide(30)).stop();
  for(let i=0;i<320;i++) sim.tick();
  nodes.forEach(n=>{n.y=Math.max(26,Math.min(H-34,n.y));});
  const svg=d3.select('#atSvg');
  svg.append('defs').html(['up','down','base'].map(k=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="17" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--${k==='base'?'faint':k})"/></marker>`).join(''));
  const lk=svg.append('g').selectAll('line').data(links).join('line').attr('stroke-width',1.6);
  const nd=svg.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer').attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.l);
  nd.append('circle').attr('r',9).attr('fill',d=>`var(${TYPES[d.t][1]})`).attr('stroke','var(--surface)').attr('stroke-width',2);
  nd.append('text').attr('text-anchor','middle').attr('font-size',10).attr('font-family','var(--font)').attr('font-weight',600).attr('fill','var(--fg-2)')
    .each(function(d){const w=d.l.split(' ');let a=d.l,b='';if(d.l.length>14&&w.length>1){const h=Math.ceil(w.length/2);a=w.slice(0,h).join(' ');b=w.slice(h).join(' ');}d3.select(this).append('tspan').attr('x',0).attr('dy',22).text(a);if(b)d3.select(this).append('tspan').attr('x',0).attr('dy',11).text(b);});
  const pos=()=>{lk.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nd.attr('transform',d=>`translate(${d.x},${d.y})`);};
  nd.call(d3.drag().on('drag',(e,d)=>{d.x=Math.max(14,Math.min(W-14,e.x));d.y=Math.max(14,Math.min(H-30,e.y));pos();}));
  nd.on('click',(e,d)=>{sel=d.id;paint();}).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel=d.id;paint();}});
  pos();

  function walk(id,dir,deep){const out=new Set(),q=[id];while(q.length){const c=q.shift();links.forEach(l=>{const s=l.source.id,t=l.target.id;const nx=dir==='up'?(t===c?s:null):(s===c?t:null);if(nx&&!out.has(nx)){out.add(nx);if(deep)q.push(nx);}});}return out;}
  function paint(){
    const up=walk(sel,'up',full), dn=walk(sel,'down',full), n=byId[sel];
    const on=id=>id===sel||up.has(id)||dn.has(id);
    nd.attr('opacity',d=>on(d.id)?1:.2).select('circle').attr('r',d=>d.id===sel?12:9).attr('stroke',d=>d.id===sel?'var(--fg)':'var(--surface)');
    lk.attr('stroke',l=>{const s=l.source.id,t=l.target.id;if((t===sel||dn.has(t))&&(s===sel||dn.has(s)))return 'var(--down)';if((s===sel||up.has(s))&&(t===sel||up.has(t)))return 'var(--up)';return 'var(--border-strong)';})
      .attr('marker-end',l=>{const s=l.source.id,t=l.target.id;if((t===sel||dn.has(t))&&(s===sel||dn.has(s)))return 'url(#ar-down)';if((s===sel||up.has(s))&&(t===sel||up.has(t)))return 'url(#ar-up)';return 'url(#ar-base)';})
      .attr('opacity',l=>on(l.source.id)&&on(l.target.id)?1:.15);
    $('#atTitle').textContent=tx(`${n.l} depends on ${up.size} assets and feeds ${dn.size}`,`${n.l} depende de ${up.size} ativos e alimenta ${dn.size}`);
    const list=s=>[...s].map(id=>`<li>${esc(byId[id].l)}</li>`).join('')||`<li class="muted">—</li>`;
    $('#atPanel').innerHTML=`<span class="eyebrow">${TYPES[n.t][0]}</span><h3>${esc(n.l)}</h3>
      <div class="listx"><div><span class="muted">${tx('Owner','Dono')}</span><b>${esc(n.o)}</b></div><div><span class="muted">${tx('Refresh','Atualização')}</span><b>${esc(n.r)}</b></div></div>
      <div class="grid g2"><div class="card kpi" style="border-color:var(--up)"><span class="v" style="color:var(--up)">${up.size}</span><span class="l">${tx('Where it comes from','De onde vem')}</span></div><div class="card kpi" style="border-color:var(--down)"><span class="v" style="color:var(--down)">${dn.size}</span><span class="l">${tx('Who depends on it','Quem depende')}</span></div></div>
      <div><h4 class="small" style="color:var(--up)">${tx('Upstream','Upstream')}</h4><ul class="ul small">${list(up)}</ul></div><div><h4 class="small" style="color:var(--down)">${tx('Downstream','Downstream')}</h4><ul class="ul small">${list(dn)}</ul></div>`;
  }
  $('#atFull').onchange=e=>{full=e.target.checked;paint();};
  paint();

  // kanban
  const COLS=[tx('To do','A fazer'),tx('In progress','Em andamento'),tx('Done','Concluído')];
  const PR={high:['bad',tx('High','Alta')],med:['warn',tx('Medium','Média')],low:['neu',tx('Low','Baixa')]};
  function drawK(){
    $('#kb').innerHTML=COLS.map((c,ci)=>`<div class="kcol" data-col="${ci}"><h4><span>${c}</span><span>${tasks.filter(t=>t.col===ci).length}</span></h4>${tasks.filter(t=>t.col===ci).map(t=>`<div class="kcard" draggable="true" data-id="${t.id}"><span${t.col===2?' style="text-decoration:line-through;color:var(--muted)"':''}>${esc(L(t.t))}</span><div class="row between"><span class="pill ${PR[t.p][0]}">${PR[t.p][1]}</span><span class="row" style="gap:4px"><span class="tiny muted">${t.d}</span>${t.col<2?`<button class="btn sm ghost" type="button" data-mv="${t.id}" aria-label="${tx('Move right','Mover para a direita')}">→</button>`:''}</span></div></div>`).join('')}</div>`).join('');
    $$('.kcard',root).forEach(c=>{c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging');};c.ondragend=()=>c.classList.remove('dragging');});
    $$('.kcol',root).forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over');};col.ondragleave=()=>col.classList.remove('over');col.ondrop=e=>{e.preventDefault();const t=tasks.find(x=>x.id===+e.dataTransfer.getData('text/plain'));if(t){t.col=+col.dataset.col;drawK();if(t.col===2)toast(tx('Task completed','Tarefa concluída'));}};});
    $$('[data-mv]',root).forEach(b=>b.onclick=()=>{const t=tasks.find(x=>x.id===+b.dataset.mv);t.col++;drawK();});
  }
  $('#kAdd').onsubmit=e=>{e.preventDefault();const v=$('#kNew').value.trim();if(!v)return;tasks.push({id:Date.now(),col:0,t:v,p:'med',d:'Nov 14'});$('#kNew').value='';drawK();toast(tx('Task added','Tarefa adicionada'));};
  drawK();

  sortableTable($('#dict'),[{k:'f',label:tx('Field','Campo'),fmt:r=>`<span class="mono">${r.f}</span>`},{k:'ty',label:tx('Inferred type','Tipo inferido')},{k:'fill',label:tx('Fill','Preenchimento'),num:true,fmt:r=>`<span class="row" style="gap:6px;flex-wrap:nowrap;justify-content:flex-end"><span class="bar-mini" style="width:46px"><i style="width:${r.fill}%"></i></span>${fmt(r.fill)}%</span>`},{k:'dist',label:tx('Distinct','Distintos'),num:true,fmt:r=>fint(r.dist)},{k:'rule',label:tx('Validation','Validação'),fmt:r=>`<span class="small">${esc(r.rule)}</span>`},{k:'sens',label:tx('Sensitive','Sensível'),sv:r=>r.sens?1:0,fmt:r=>r.sens?`<span class="pill bad">${tx('sensitive','sensível')}</span>`:''}],A.dict,{sortKey:'sens'});

function attainment(sev,r){const [a,b,c]=DATA.vuln.TIERS[sev];if(r<=0)return 0;if(r<a)return 80*r/a;if(r<b)return 80+20*(r-a)/(b-a);if(c===b)return 120;if(r<c)return 100+20*(r-b)/(c-b);return 120;}

      <div class="callout" style="font-size:.86rem">${tx(`${SL[sev]}: reduction r = <b>${fmt(red)}%</b> falls in branch ${br+1}, so attainment = <b>${fmt(att)}%</b>.`,`${SL[sev]}: redução r = <b>${fmt(red)}%</b> cai no ramo ${br+1}, então atingimento = <b>${fmt(att)}%</b>.`)}</div></div>

    const g0=rows.length+2; add(tx('Global · severity','Global · severidade'),'Global',SEV,gb,gc); add('Global','Global',SEV,gb,gc,true,g0,g0+3);

  function calc(){ if($('#fFx',root)) $('#fFx',root).textContent=FX_ATT('I2',st.sev); if($('#calcFx',root)) $('#calcFx',root).innerHTML=fxCard(st.sev,st.b>0?100*(st.b-st.c)/st.b:0,'J2');

    $('#pjCall',root).innerHTML=`<div class="callout ${ok?'ok':'bad'}">${ok?tx('On track. Keep at least','No caminho. Mantenha pelo menos'):tx('To close the gap the teams need to treat about','Para fechar a distância os times precisam tratar cerca de')} <b>${fint(need)}</b> ${tx('findings per month in Nov and Dec.','achados por mês em nov e dez.')}</div>`;
    const labels=DATA.MONTHS[LANG].slice(2);

      [tx('Target reduction weighted by severity mix','Redução-alvo ponderada pelo mix de severidade'),pct(tred)],

  root.innerHTML=`<div class="tabs" role="tablist">${[['heat',tx('Heat & mortality','Calor & mortalidade')],['terr',tx('Territory','Território')],['layers',tx('Data layers & lineage','Camadas de dados & linhagem')]].map(([k2,l])=>`<button class="tab" role="tab" type="button" data-ct="${k2}" aria-selected="${st.tab===k2}">${l}</button>`).join('')}</div><div id="chBody" style="display:grid;gap:16px"></div>`;

  }
  function heat(el){
    el.innerHTML=`<div class="grid g2" style="align-items:start">
      <div class="card pad stack-y" style="gap:6px"><div class="chart-title">${tx('An extreme-heat day raises the risk of death by 21% over the next five days','Um dia de calor extremo aumenta em 21% o risco de óbito nos cinco dias seguintes')}</div><div class="chart-sub">${tx('Relative risk of natural-cause death, lag 0–4 days, vs daily mean temperature · 95% band','Risco relativo de óbito por causas naturais, defasagem 0–4 dias, vs temperatura média diária · faixa de 95%')}</div><div class="chart-box" style="height:260px"><canvas id="erC" aria-label="Exposure-response"></canvas></div></div>
      <div class="card pad stack-y" style="gap:6px"><div class="chart-title">${tx('The effect peaks 2–4 days later, then is partly offset','O efeito atinge o pico 2–4 dias depois e é parcialmente compensado')}</div><div class="chart-sub">${tx('Relative risk by lag band at the P99 temperature (27.1 °C)','Risco relativo por faixa de defasagem na temperatura P99 (27,1 °C)')}</div><div class="chart-box" style="height:260px"><canvas id="lagC" aria-label="Lag bands"></canvas></div></div></div>
      <div class="card pad stack-y" style="gap:10px"><h4>${tx('Heat alert sketch · what does a forecast day mean?','Esboço de alerta de calor · o que significa um dia previsto?')}</h4>
        <div class="grid g-side" style="align-items:center"><div class="slider-row"><label for="tS">${tx('Forecast daily mean temperature','Temperatura média diária prevista')}</label><output id="tO"></output><input type="range" id="tS" min="20" max="28" step="0.1" value="${st.T}"></div>
        <div class="card kpi"><span class="l">${tx('Relative risk, next 5 days','Risco relativo, próximos 5 dias')}</span><span class="v" id="rrV"></span><span class="s muted" id="rrS"></span></div></div>
        <div class="callout" id="rrC"></div></div>
      <p class="tiny muted">${tx('Headline estimates come from the project’s DLNM (quasi-Poisson, lags 0–21, 2008–2024). Curve and lag-band shapes are illustrative reconstructions anchored to those estimates.','As estimativas principais vêm do DLNM do projeto (quasi-Poisson, defasagens 0–21, 2008–2024). As formas da curva e das faixas são reconstruções ilustrativas ancoradas nessas estimativas.')}</p>`;
    const xs=[];for(let t=20;t<=28.01;t+=0.2)xs.push(+t.toFixed(1));
    mkChart($('#erC',el),{type:'line',data:{datasets:[{data:xs.map(t=>({x:t,y:rr(t,ku)})),borderColor:'transparent',backgroundColor:cssv('--primary-tint'),fill:'+1',pointRadius:0},{data:xs.map(t=>({x:t,y:rr(t,kl)})),borderColor:'transparent',pointRadius:0,fill:false},{data:xs.map(t=>({x:t,y:rr(t)})),borderColor:cssv('--primary'),borderWidth:2.5,pointRadius:0,fill:false}]},
      options:{scales:{x:{type:'linear',min:20,max:28,title:{display:true,text:tx('daily mean temperature (°C)','temperatura média diária (°C)')},ticks:{stepSize:1}},y:{min:.9,max:1.45,title:{display:true,text:'RR'}}},plugins:{tooltip:{filter:c=>c.datasetIndex===2,callbacks:{title:c=>fmt(c[0].raw.x)+' °C',label:c=>'RR '+fmt(c.raw.y,2)}},annot:{h:[{v:1,c:cssv('--faint'),dash:[3,3]}],v:[{v:MMT,c:cssv('--muted'),label:tx('lowest risk 24.8 °C','menor risco 24,8 °C'),align:'right'},{v:P99,c:cssv('--f-prod'),label:'P99 27.1 °C'},{v:st.T,c:cssv('--fg'),dash:[]}]}}},plugins:[annotPlugin]});
    const LB=[['0–1',1.04],['2–4',1.16],['5–10',.95],['11–21',1.04]];
    mkChart($('#lagC',el),{type:'bar',data:{labels:LB.map(x=>x[0]+' '+tx('days','dias')),datasets:[{data:LB.map(x=>x[1]-1),base:0,backgroundColor:LB.map(x=>x[0]==='2–4'?cssv('--f-prod'):cssv('--grey-mark')),borderRadius:4}]},
      options:{scales:{y:{min:-.1,max:.25,ticks:{callback:v=>'RR '+fmt(1+v,2)}},x:{grid:{display:false}}},plugins:{tooltip:{callbacks:{label:c=>'RR '+fmt(1+c.raw,2)}},annot:{h:[{v:0,c:cssv('--fg-2'),dash:[]}]}}},plugins:[annotPlugin]});
    const upd=()=>{const r=rr(st.T);$('#tO',el).textContent=fmt(st.T)+' °C';$('#rrV',el).textContent=fmt(r,2);
      const pctile=st.T>=P99?'≥ P99':st.T>=26.3?'≈ P90–P99':st.T>=MMT?'> '+tx('lowest-risk temp.','temp. de menor risco'):'< '+tx('lowest-risk temp.','temp. de menor risco');

      $('#rrC',el).innerHTML=extra>0?tx(`For every 100 deaths normally expected in the next five days, expect about <b>${extra} more</b>. ${extra>=10?'Above +10% a heat alert would notify hospitals and primary care.':''}`,`Para cada 100 óbitos normalmente esperados nos próximos cinco dias, espere cerca de <b>${extra} a mais</b>. ${extra>=10?'Acima de +10% um alerta de calor avisaria hospitais e atenção primária.':''}`):tx('At or below the lowest-risk temperature: no heat excess expected. Cold effects show up over longer lags (circulatory deaths: RR 1.70 at 15.5 °C over 21 days).','Na temperatura de menor risco ou abaixo: sem excesso por calor. Efeitos do frio aparecem em defasagens mais longas (óbitos circulatórios: RR 1,70 a 15,5 °C em 21 dias).');

  }
  function terr(el){
    const R=DATA.rng(548), hex=[];
    const DIST=[['centro','Centro'],['bv','Bela Vista'],['ja','Jardim das Acácias'],['vo','Vila Operária'],['pa','Parque das Águas'],['ac','Alto do Cruzeiro'],['ne','Nova Esperança']];
    for(let q=-6;q<=6;q++)for(let r=-6;r<=6;r++){const s3=-q-r;if(Math.max(Math.abs(q),Math.abs(r),Math.abs(s3))>6)continue;const d=Math.max(Math.abs(q),Math.abs(r),Math.abs(s3));if(d>=5&&R()<.45)continue;
      const x=q+r/2,y=r*0.866,ang=(Math.atan2(y,x)*180/Math.PI+360)%360, di=d<=1?0:1+Math.floor(((ang+30)%360)/60);
      const nw=[0,0,1.2,1.8,-1.6,-0.6,-2.2][di]||0, tb=[0,10,26,-6,30,14,-8][di]||0;
      const old=DATA.clamp(9+(6-d)*1.6+R()*5+(di===0?3:0),5,30), inc=Math.round(DATA.clamp(1100+(6-d)*240+nw*420+R()*600,700,4800)), tree=DATA.clamp(18+tb+R()*26-(6-d)*2,3,85);
      const hvi=DATA.clamp(0.45*(old-5)/25+0.3*(1-(inc-700)/4100)+0.25*(1-tree/85),0,1);
      hex.push({id:hex.length+1,q,r,old,inc,tree,hvi,di,pop:Math.round(250+R()*450)});}
    const VAR={hvi:[tx('Heat vulnerability index','Índice de vulnerabilidade ao calor'),x=>fmt(x,2)],old:[tx('Residents aged 65+','Moradores com 65+'),x=>fmt(x,1)+'%'],inc:[tx('Mean household income','Renda média domiciliar'),x=>'R$ '+fint(x)],tree:[tx('Homes with a tree in front','Domicílios com árvore em frente'),x=>fmt(x,0)+'%']};
    const dstat=DIST.map(([k,n],i)=>{const hs=hex.filter(h=>h.di===i);return {i,n,hvi:mean(hs.map(h=>h.hvi)),pop:hs.reduce((a,h)=>a+h.pop,0),cnt:hs.length};}).sort((a,b)=>b.hvi-a.hvi);
    let sel=null;
    const draw2=()=>{
      const vals=hex.map(h=>h[st.v]), mn=Math.min(...vals), mx=Math.max(...vals), inv=st.v==='inc'||st.v==='tree';
      const col=v=>{let t=(v-mn)/(mx-mn||1);if(inv)t=1-t;return `color-mix(in srgb, var(--f-prod) ${Math.round(8+t*82)}%, var(--surface-2))`;};
      const S=22,W=Math.sqrt(3)*S, cxy=h=>[300+W*(h.q+h.r/2),260+1.5*S*h.r], pts=(cx,cy)=>[...Array(6)].map((_,i)=>{const a=Math.PI/180*(60*i-30);return `${(cx+S*Math.cos(a)).toFixed(1)},${(cy+S*Math.sin(a)).toFixed(1)}`;}).join(' ');
      const top=[...hex].sort((a,b)=>b.hvi-a.hvi).slice(0,5).map(h=>h.id);
      let svg=hex.map(h=>{const [cx,cy]=cxy(h);return `<polygon class="hex" points="${pts(cx,cy)}" fill="${col(h[st.v])}" data-h="${h.id-1}" opacity="${sel===null||sel===h.di?1:.25}"><title>${DIST[h.di][1]} · ${tx('tract','setor')} ${h.id}: ${VAR[st.v][1](h[st.v])}</title></polygon>`;}).join('');
      svg+=hex.filter(h=>top.includes(h.id)).map(h=>{const [cx,cy]=cxy(h);return `<circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="var(--fg)" stroke-width="2.5" pointer-events="none"/>`;}).join('');
      svg+=DIST.map(([k,n],i)=>{const hs=hex.filter(h=>h.di===i);const c=hs.map(cxy);const x=mean(c.map(p=>p[0])),y=mean(c.map(p=>p[1]));return `<text x="${x}" y="${y}" text-anchor="middle" font-size="12.5" font-weight="750" fill="var(--fg)" stroke="var(--surface)" stroke-width="4" paint-order="stroke" pointer-events="none" opacity="${sel===null||sel===i?1:.35}">${n}</text>`;}).join('');
      $('#hexSvg',el).innerHTML=svg;
      $('#hexLeg',el).innerHTML=`<div class="row" style="flex-wrap:nowrap;gap:8px;flex:1;min-width:200px"><span class="small muted">${VAR[st.v][1](inv?mx:mn)}</span><span class="legendbar" style="flex:1;background:linear-gradient(90deg,color-mix(in srgb,var(--f-prod) 8%,var(--surface-2)),var(--f-prod))"></span><span class="small muted">${VAR[st.v][1](inv?mn:mx)}</span></div>
        <span class="row small" style="gap:6px"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="var(--fg)" stroke-width="2.5"/></svg>${tx('5 tracts with the highest heat vulnerability','5 setores com maior vulnerabilidade ao calor')}</span>`;
      $('#dList',el).innerHTML=`<button type="button" aria-pressed="${sel===null}" data-dd=""><span class="sw" style="background:var(--grey-mark)"></span><span>${tx('Whole city','Cidade inteira')}</span><b class="num small">${fmt(mean(hex.map(h=>h.hvi)),2)}</b></button>`+dstat.map(d=>`<button type="button" aria-pressed="${sel===d.i}" data-dd="${d.i}"><span class="sw" style="background:color-mix(in srgb,var(--f-prod) ${Math.round(8+82*(d.hvi-0.2)/0.5)}%,var(--surface-2))"></span><span>${d.n}<br><span class="tiny muted">${d.cnt} ${tx('tracts','setores')} · ${fint(d.pop)} ${tx('people','pessoas')}</span></span><b class="num small">${fmt(d.hvi,2)}</b></button>`).join('');
      $$('[data-dd]',el).forEach(b=>b.onclick=()=>{sel=b.dataset.dd===''?null:+b.dataset.dd;draw2();});
      $$('[data-h]',el).forEach(p=>p.onclick=()=>{const h=hex[+p.dataset.h];const rank=[...hex].sort((a,b)=>b.hvi-a.hvi).findIndex(x=>x.id===h.id)+1;openModal({eyebrow:`${DIST[h.di][1]} · ${tx('fictional district','bairro fictício')}`,title:`${tx('Census tract','Setor censitário')} ${h.id}`,html:`<div class="grid g4">${Object.entries(VAR).map(([k2,[n,f]])=>`<div class="card kpi"><span class="l">${n}</span><span class="v" style="font-size:1.3rem">${f(h[k2])}</span></div>`).join('')}</div><div class="callout${rank<=5?' bad':''}">${tx(`Ranked <b>${rank} of ${hex.length}</b> tracts by heat vulnerability. ${fint(h.pop)} residents.`,`Posição <b>${rank} de ${hex.length}</b> setores em vulnerabilidade ao calor. ${fint(h.pop)} moradores.`)}</div><p class="prose small">${tx('The index weights older residents (45%), low income (30%) and missing tree cover (25%), each rescaled 0–1 across the city.','O índice pondera moradores idosos (45%), renda baixa (30%) e falta de arborização (25%), cada um reescalado de 0 a 1 na cidade.')}</p>`});});
    };
    const topD=dstat[0];
    el.innerHTML=`<div class="grid g-side" style="align-items:start"><div class="card pad stack-y hexmap" style="gap:8px"><div class="chart-title">${tx(`${topD.n} and ${dstat[1].n} concentrate heat vulnerability: older residents, lower income, fewer trees`,`${topD.n} e ${dstat[1].n} concentram a vulnerabilidade ao calor: moradores mais velhos, renda menor, menos árvores`)}</div>
      <div class="chart-sub">${tx('Each hexagon is one census tract of a fictional mid-size city laid out like Divinópolis: a dense older centre ringed by newer neighbourhoods. Click a tract or a district.','Cada hexágono é um setor censitário de uma cidade média fictícia com o desenho de Divinópolis: um centro antigo e denso cercado por bairros mais novos. Clique num setor ou bairro.')}</div>
      <svg id="hexSvg" viewBox="0 0 600 520" role="img" aria-label="${tx('Territory map','Mapa do território')}"></svg><div class="row" id="hexLeg" style="gap:10px 18px"></div></div>
      <div class="stack-y" style="gap:12px;align-content:start"><div class="card pad stack-y" style="gap:10px"><label class="field">${tx('Map variable','Variável do mapa')}<select id="hexVar">${Object.entries(VAR).map(([k2,[n]])=>`<option value="${k2}"${st.v===k2?' selected':''}>${n}</option>`).join('')}</select></label>
      <span class="eyebrow">${tx('Districts by heat vulnerability','Bairros por vulnerabilidade ao calor')}</span><div class="dlist" id="dList"></div></div>
      <p class="tiny muted">${tx('Synthetic territory and district names. The real project works on Divinópolis’s 548 IBGE census tracts with Census 2022 variables, Landsat surface temperature and city flood zones.','Território e nomes de bairros sintéticos. O projeto real trabalha com os 548 setores do IBGE de Divinópolis, variáveis do Censo 2022, temperatura de superfície Landsat e áreas de inundação da Prefeitura.')}</p></div></div>`;
    $('#hexVar',el).onchange=e=>{st.v=e.target.value;draw2();}; draw2();
  }
  function draw(){ dropCharts(['erC','lagC']); const el=$('#chBody',root); ({layers,heat,terr})[st.tab](el); }
  draw();
}

  kpis:[['143,283',tx('SUS admissions of residents, 2008 – Jan 2026','internações SUS de residentes, 2008 – jan 2026')],['548',tx('census tracts · 231,091 residents, matching IBGE exactly','setores censitários · 231.091 moradores, batendo com o IBGE')],['+21%',tx('death risk after an extreme-heat day (95% CI 10–33%)','risco de óbito após dia de calor extremo (IC95% 10–33%)')],['10',tx('official sources with field-level lineage','fontes oficiais com linhagem por campo')]],
  context:`<p>${tx('Hospitals feel heat waves and cold snaps days after they arrive. The question behind this project is whether official public data on weather, territory and health can anticipate that demand early enough to plan beds, staff and alerts.','Hospitais sentem ondas de calor e frentes frias dias depois que elas chegam. A pergunta do projeto é se dados públicos oficiais de clima, território e saúde conseguem antecipar essa demanda a tempo de planejar leitos, equipes e alertas.')}</p><p>${tx('It starts in Divinópolis (MG), a regional hub of ~231 thousand people, and is designed to expand to the Oeste de Minas macroregion, then the state, the country and other countries. The long-term product is a Hospital Demand Simulator.','Começa em Divinópolis (MG), polo regional de ~231 mil habitantes, e foi desenhado para expandir para a macrorregião Oeste de Minas, depois o estado, o país e outros países. O produto de longo prazo é um Simulador de Demanda Hospitalar.')}</p>`,
  built:`<p>${tx('A Python package with a RAW → BRONZE → SILVER → GOLD pipeline over ten official sources, a source catalog, a data dictionary, lineage per field and a quality report. A monthly job re-downloads what changed, rebuilds derived layers and regenerates the report without me.','Um pacote Python com pipeline RAW → BRONZE → SILVER → GOLD sobre dez fontes oficiais, catálogo de fontes, dicionário de dados, linhagem por campo e relatório de qualidade. Um job mensal baixa de novo o que mudou, reconstrói as camadas derivadas e regenera o relatório sem mim.')}</p><p>${tx('On top of it: distributed-lag non-linear models (DLNM) for heat and mortality, monthly association tests with false-discovery control, and honest forecast baselines.','Sobre isso: modelos de defasagem distribuída não linear (DLNM) para calor e mortalidade, testes de associação mensais com controle de falsas descobertas e linhas de base de previsão honestas.')}</p>`,
  flow:flowCols(['DATASUS SIH · SIM · CNES','INMET stations · NASA POWER','IBGE Census 2022 · ANS','City GeoServer · Landsat'],['RAW → BRONZE (typed)','SILVER (harmonized grain)','GOLD (analysis-ready)','DLNM & association tests'],['Interactive report','Source catalog & lineage','Quality report'],['Hospital planners','Public-health research','Region expansion']),
  demoHint:tx('Three report tabs: move the forecast temperature, explore the territory by district, then trace every source and its lineage','Três abas do relatório: mova a temperatura prevista, explore o território por bairro e depois rastreie cada fonte e sua linhagem'),
  demo:demoClimate,
  decisions:[[tx('Official public sources only','Somente fontes públicas oficiais'),tx('Anyone can re-download and check every number; nothing is invented or scraped from unofficial sites.','Qualquer pessoa pode baixar de novo e conferir cada número; nada é inventado ou raspado de sites não oficiais.')],
    [tx('Grain written on every table','Granularidade escrita em toda tabela'),tx('Day × station, month × municipality, census tract: stating it prevents silently mixing daily and monthly data.','Dia × estação, mês × município, setor censitário: declarar evita misturar dados diários e mensais em silêncio.')],
    [tx('Residence and hospital location, side by side','Residência e local do hospital, lado a lado'),tx('The city treats the region, so demand on its hospitals is not the same as illness among its residents.','A cidade atende a região, então a demanda nos hospitais não é a mesma coisa que o adoecimento dos moradores.')],
    [tx('Beat a seasonal baseline or say so','Vencer a linha de base sazonal ou admitir'),tx('“Same month last year” is hard to beat for monthly admissions; the report says that instead of hiding it.','“Mesmo mês do ano anterior” é difícil de bater em internações mensais; o relatório diz isso em vez de esconder.')],
    [tx('Fix my own bugs in public','Corrigir meus próprios erros às claras'),tx('A one-day shift in pre-2017 weather data was found in validation, documented and every dependent result recomputed.','Um deslocamento de um dia nos dados de clima antes de 2017 foi achado na validação, documentado e todos os resultados dependentes recalculados.')]],
  rules:`<div class="formula">${tx('model','modelo')}        deaths(day) ~ quasi-Poisson
               + crossbasis( Tmean: natural spline, knots P10/P75/P90 ;
                             lags 0–21 in bands 0–1, 2–4, 5–10, 11–21 )
               + ns(time, 7 df/year) + day_of_week + holidays
${tx('period','período')}       2008–2024, ${tx('excluding Mar/2020 – Dec/2021 (COVID-19)','excluindo mar/2020 – dez/2021 (COVID-19)')}
${tx('heat contrast','contraste calor')} P99 (27.1 °C) vs ${tx('lowest-risk temperature','temperatura de menor risco')} (24.8 °C)</div>
    <ul><li>${tx('Heatwave = 3+ consecutive days with maximum above the seasonal P90.','Onda de calor = 3+ dias seguidos com máxima acima do P90 da época.')}</li><li>${tx('Monthly associations use temperature anomalies (season removed) and Benjamini–Hochberg q-values; q < 0.10 is the threshold.','Associações mensais usam anomalias de temperatura (sem a estação) e q-valores de Benjamini–Hochberg; q < 0,10 é o limiar.')}</li><li>${tx('Leakage guard: reference climatology 2008–2020, before the test period; honest forecasts use only the previous month.','Proteção contra vazamento: climatologia de referência 2008–2020, antes do período de teste; previsões honestas usam só o mês anterior.')}</li></ul>`,
  results:`<ul><li>${tx('Extreme heat: +21% natural-cause death risk over lag 0–4 (95% CI 10–33%); +23% for people aged 65+ (5–43%). Robust to 4, 7 or 10 df/year and to the weather source.','Calor extremo: +21% de risco de óbito por causas naturais na defasagem 0–4 (IC95% 10–33%); +23% para 65+ (5–43%). Robusto a 4, 7 ou 10 gl/ano e à fonte de clima.')}</li><li>${tx('Cold: circulatory deaths RR 1.70 (1.02–2.83) at 15.5 °C over 21 days.','Frio: óbitos circulatórios RR 1,70 (1,02–2,83) a 15,5 °C em 21 dias.')}</li><li>${tx('Monthly admissions: urgent circulatory admissions fall ~5% per +1 °C anomaly in the previous month (IRR 0.947, q = 0.01) — a hypothesis, not a cause.','Internações mensais: internações circulatórias de urgência caem ~5% por +1 °C de anomalia no mês anterior (IRR 0,947, q = 0,01) — hipótese, não causa.')}</li><li>${tx('Registered SUS beds in the city fell while admissions performed there rose: supply shocks, not weather, dominate forecast errors.','Os leitos SUS cadastrados na cidade caíram enquanto as internações feitas lá subiram: choques de oferta, não o clima, dominam o erro de previsão.')}</li></ul>`,

/* ===================== CASE 7 · NFL tracking (Big Data Bowl) ===================== */
function demoNfl(root){
  const KINDS={slant:'Slant',out:'Out',go:'Go'};
  const plays=Object.fromEntries(Object.keys(KINDS).map(k=>[k,DATA.nflPlay(k)]));
  const OFFN=['J. Carter','D. Moss','R. Hale','T. Brooks','L. Owens','M. Diaz','K. Shaw','A. Pratt','B. Lyons','C. Ford','E. Grant'];
  const DEFN=['M. Ellis','S. Boone','N. Ward','O. Price','P. Lane','Q. Hart','V. Cole','W. Nash','Y. Reed','Z. Kemp','F. Rios'];
  const JER=[11,8,28,72,65,61,66,77,84,87,15, 24,95,93,91,97,52,54,50,21,32,29];
  const roster=k=>plays[k].players.map((p,i)=>({i,team:p.team,role:p.role==='TGT'?'WR':p.role,tgt:p.role==='TGT',name:p.team==='off'?OFFN[i]:DEFN[i-11],num:JER[i]}));
  let kind='slant', f=0, timer=null, A=0, B=11;
  const mph=v=>v*10*0.9144*2.237/1; // yd per frame → mph
  root.innerHTML=`
    <div class="row between"><div class="seg" role="group" aria-label="Route">${Object.entries(KINDS).map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${kind===k}">${l}</button>`).join('')}</div>
      <div class="row"><button class="btn primary sm" type="button" id="nPlay">▶ ${tx('Play','Rodar')}</button><input type="range" id="nScrub" min="0" max="45" value="0" aria-label="Frame" style="width:180px"><span class="mono small" id="nFrame"></span></div></div>
    <div class="chart-title" id="nTitle"></div>
    <div class="phase" id="nPhase"></div>
    <div class="grid g2" style="align-items:start">
      <div class="card pad-s stack-y" style="gap:8px"><svg class="field-svg" id="nField" viewBox="22 0 54 53.3" role="img" aria-label="${tx('Play animation','Animação da jogada')}"></svg>
        <div class="row small" style="gap:6px 14px"><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--primary)"></span>${tx('Offense','Ataque')}</span><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--f-prod)"></span>${tx('Defense','Defesa')}</span><span class="row" style="gap:5px"><span style="width:12px;height:12px;border-radius:50%;border:2.5px solid var(--f-ds)"></span>${tx('Targeted receiver','Recebedor alvo')}</span><span class="row" style="gap:5px"><span style="width:16px;border-top:2px dashed var(--fg)"></span>${tx('gap to nearest defender','distância ao defensor mais próximo')}</span></div></div>
      <div class="card pad stack-y" style="gap:6px"><div class="chart-title" id="nSepT"></div><div class="chart-sub">${tx('Distance from the targeted receiver to the nearest defender, every 0.1 s · shaded = ball in the air','Distância do recebedor alvo ao defensor mais próximo, a cada 0,1 s · sombreado = bola no ar')}</div><div class="chart-box" style="height:230px"><canvas id="nSep" aria-label="Separation"></canvas></div>
        <div class="panel small" id="nRead"></div></div>
    </div>
    <div class="card pad stack-y" style="gap:12px"><div class="row between"><h4>${tx('Compare two players','Comparar dois jogadores')}</h4><div class="row"><label class="field" style="min-width:180px"><span style="color:var(--f-ds-ink)">● ${tx('Player A','Jogador A')}</span><select id="pA"></select></label><label class="field" style="min-width:180px"><span style="color:var(--f-strat-ink)">● ${tx('Player B','Jogador B')}</span><select id="pB"></select></label></div></div>
      <div class="chart-title" id="cmpT"></div>
      <div class="chart-box" style="height:200px"><canvas id="nCmp" aria-label="Speed comparison"></canvas></div>
      <div class="pcmp" id="pcmp"></div></div>`;
  const svg=$('#nField',root);
  const phases=p=>{const thr=p.arrival-9;return [[0,4,tx('Snap','Snap'),tx('Ball is snapped; everyone starts from the line.','A bola é snapada; todos saem da linha.')],[5,11,tx('Route stem','Início da rota'),tx('Receiver runs upfield to sell a vertical route.','Recebedor corre em linha reta para vender uma rota vertical.')],[12,thr,tx('Break','Quebra'),tx('Receiver cuts; the defender has to react, and space opens or closes.','Recebedor corta; o defensor precisa reagir, e o espaço abre ou fecha.')],[thr+1,p.arrival,tx('Ball in the air','Bola no ar'),tx('Quarterback has thrown; what matters is the gap when it lands.','Quarterback lançou; o que importa é a distância quando a bola chega.')]];};
  const speed=(pl,i)=>i===0?0:Math.hypot(pl.pts[i].x-pl.pts[i-1].x,pl.pts[i].y-pl.pts[i-1].y);
  function field(){
    const p=plays[kind]; let h=`<rect x="0" y="0" width="120" height="53.3" fill="var(--surface-2)"/>`;
    for(let x=10;x<=110;x+=5) h+=`<line x1="${x}" y1="0" x2="${x}" y2="53.3" stroke="var(--border-strong)" stroke-width="${x%10?0.08:0.18}"/>`;
    for(let x=20;x<=100;x+=10) h+=`<text x="${x}" y="5" font-size="2.4" text-anchor="middle" fill="var(--faint)" font-family="var(--font)">${x<=60?x-10:110-x}</text>`;
    h+=`<line x1="${p.LOS}" y1="0" x2="${p.LOS}" y2="53.3" stroke="var(--primary)" stroke-width=".3" stroke-dasharray="1 .6"/><text x="${p.LOS+0.6}" y="51.5" font-size="1.8" text-anchor="start" fill="var(--primary-ink)" font-family="var(--font)">${tx('line of scrimmage','linha de scrimmage')}</text>`;
    const tgt=p.players[0].pts; h+=`<polyline fill="none" stroke="var(--f-ds)" stroke-width=".25" stroke-dasharray=".8 .5" points="${tgt.map(q=>`${q.x},${q.y}`).join(' ')}" opacity=".7"/>`;
    h+=`<polyline id="trA" fill="none" stroke="var(--f-ds)" stroke-width=".5"/><polyline id="trB" fill="none" stroke="var(--f-strat)" stroke-width=".5"/>`;
    h+=`<line id="nLink" stroke="var(--fg)" stroke-width=".22" stroke-dasharray=".6 .4"/><g id="nTag"><rect rx=".6" height="3" width="9.5" fill="var(--fg)"/><text font-size="1.8" fill="var(--bg)" font-family="var(--font)" font-weight="700"></text></g>`;
    const R=roster(kind);
    p.players.forEach((pl,i)=>{h+=`<g data-p="${i}" style="cursor:pointer"><circle r="${pl.role==='TGT'?1.15:.95}" fill="var(${pl.team==='off'?'--primary':'--f-prod'})" stroke="${pl.role==='TGT'?'var(--f-ds)':'var(--surface)'}" stroke-width="${pl.role==='TGT'?.5:.15}"/><text font-size="1.05" text-anchor="middle" dy=".38" fill="#fff" font-family="var(--font)" font-weight="700" pointer-events="none">${R[i].num}</text><title>#${R[i].num} ${R[i].name} · ${R[i].role}</title></g>`;});
    h+=`<circle id="selA" r="1.9" fill="none" stroke="var(--f-ds)" stroke-width=".35"/><circle id="selB" r="1.9" fill="none" stroke="var(--f-strat)" stroke-width=".35"/>`;
    svg.innerHTML=h;
    $$('g[data-p]',svg).forEach(g=>g.onclick=()=>{const i=+g.dataset.p;if(i===A)return;B=A;A=i;selects();cmp();frame();});
    frame();
  }
  function frame(){
    const p=plays[kind];
    $$('g[data-p]',svg).forEach(g=>{const q=p.players[+g.dataset.p].pts[f];g.setAttribute('transform',`translate(${q.x},${q.y})`);});
    const t=p.players[0].pts[f];let near=null,md=1e9;p.players.filter(x=>x.team==='def').forEach(d=>{const q=d.pts[f];const dd=Math.hypot(q.x-t.x,q.y-t.y);if(dd<md){md=dd;near=q;}});
    const ln=$('#nLink',svg); ln.setAttribute('x1',t.x);ln.setAttribute('y1',t.y);ln.setAttribute('x2',near.x);ln.setAttribute('y2',near.y);
    const tag=$('#nTag',svg); tag.setAttribute('transform',`translate(${Math.min(t.x+1.8,66)},${Math.max(t.y-5,1)})`); $('text',tag).setAttribute('x',.6); $('text',tag).setAttribute('y',2.1); $('text',tag).textContent=`${fmt(md,1)} yd`;
    [['A',A],['B',B]].forEach(([k,i])=>{const pts=p.players[i].pts.slice(0,f+1);$('#tr'+k,svg).setAttribute('points',pts.map(q=>`${q.x},${q.y}`).join(' '));const q=p.players[i].pts[f];$('#sel'+k,svg).setAttribute('cx',q.x);$('#sel'+k,svg).setAttribute('cy',q.y);});
    $('#nScrub',root).value=f; $('#nFrame',root).textContent=`${tx('frame','quadro')} ${f} · ${fmt(f/10,1)} s`;
    const ph=phases(p), cp=ph.findIndex(x=>f>=x[0]&&f<=x[1]);
    $('#nPhase',root).innerHTML=ph.map((x,k)=>`<div class="${k===(cp<0?3:cp)?'on':''}"><b>${k+1} · ${x[2]}</b>${x[3]}</div>`).join('');
    $('#nRead',root).innerHTML=`<b>${tx('Right now','Agora')}:</b> ${tx(`the targeted receiver (#${roster(kind)[0].num}) is <b>${fmt(md,1)} yards</b> from the nearest defender${f>=p.arrival?' — the ball has arrived.':'.'}`,`o recebedor alvo (#${roster(kind)[0].num}) está a <b>${fmt(md,1)} jardas</b> do defensor mais próximo${f>=p.arrival?' — a bola chegou.':'.'}`)}`;
    const c=findChart('nSep'); if(c){c.options.plugins.annot.v[0].v=f;c.update('none');}
    const c2=findChart('nCmp'); if(c2){c2.options.plugins.annot.v[0].v=f;c2.update('none');}
  }
  function chart(){
    const p=plays[kind], at={};Object.keys(KINDS).forEach(k=>at[k]=plays[k].sep[plays[k].arrival]);const best=Object.keys(at).reduce((a,b)=>at[a]>at[b]?a:b);
    $('#nTitle',root).textContent=tx(`At ball arrival the ${KINDS[best]} route creates the most space: ${fmt(at[best],1)} yd vs ${Object.keys(KINDS).filter(k=>k!==best).map(k=>`${fmt(at[k],1)} (${KINDS[k]})`).join(', ')}`,`Na chegada da bola a rota ${KINDS[best]} cria mais espaço: ${fmt(at[best],1)} jd vs ${Object.keys(KINDS).filter(k=>k!==best).map(k=>`${fmt(at[k],1)} (${KINDS[k]})`).join(', ')}`);
    $('#nSepT',root).textContent=tx(`${KINDS[kind]}: ${fmt(p.sep[p.arrival],1)} yards of separation when the ball arrives`,`${KINDS[kind]}: ${fmt(p.sep[p.arrival],1)} jardas de separação quando a bola chega`);
    dropCharts(['nSep']);
    mkChart($('#nSep',root),{type:'line',data:{labels:p.sep.map((_,i)=>i),datasets:[{data:p.sep,borderColor:cssv('--f-ds'),backgroundColor:'transparent',pointRadius:0,tension:.3,borderWidth:2.5}]},
      options:{animation:false,scales:{y:{min:0,title:{display:true,text:tx('yards','jardas')}},x:{ticks:{maxTicksLimit:10},title:{display:true,text:tx('frame (0.1 s)','quadro (0,1 s)')},grid:{display:false}}},plugins:{tooltip:{callbacks:{label:c=>fmt(c.raw,2)+' yd'}},annot:{band:[{from:p.arrival-9,to:p.arrival,c:cssv('--primary-tint')}],v:[{v:f,c:cssv('--fg-2'),dash:[]},{v:p.arrival,c:cssv('--f-ds-ink'),label:tx('arrives','chega'),align:'right'}]}}},plugins:[annotPlugin]});
  }
  function selects(){
    const R=roster(kind), opt=sel=>R.map(r=>`<option value="${r.i}"${r.i===sel?' selected':''}>#${r.num} ${r.name} · ${r.role}${r.tgt?' ('+tx('target','alvo')+')':''} · ${r.team==='off'?tx('OFF','ATA'):tx('DEF','DEF')}</option>`).join('');
    $('#pA',root).innerHTML=opt(A); $('#pB',root).innerHTML=opt(B);
  }
  function cmp(){
    const p=plays[kind], R=roster(kind), PA=p.players[A], PB=p.players[B];
    const sp=pl=>pl.pts.map((_,i)=>mph(speed(pl,i)));
    const st=pl=>{const s=sp(pl);let d=0;for(let i=1;i<pl.pts.length;i++)d+=speed(pl,i);return {top:Math.max(...s),dist:d,avg:mean(s.slice(1))};};
    const gap=p.players[A].pts.map((q,i)=>Math.hypot(q.x-PB.pts[i].x,q.y-PB.pts[i].y));
    const sa=st(PA),sb=st(PB),ga=gap[p.arrival];
    $('#cmpT',root).textContent=tx(`#${R[A].num} ${R[A].name} tops out at ${fmt(sa.top,1)} mph vs ${fmt(sb.top,1)} mph for #${R[B].num} ${R[B].name}; they are ${fmt(ga,1)} yd apart when the ball arrives`,`#${R[A].num} ${R[A].name} chega a ${fmt(sa.top,1)} mph vs ${fmt(sb.top,1)} mph de #${R[B].num} ${R[B].name}; estão a ${fmt(ga,1)} jd um do outro quando a bola chega`);

/* ===================== ML CASES · Pix fraud & authentication score (fictional "Vértice Bureau") ===================== */
const ML=(()=>{
  const R=DATA.rng(777), sig=x=>1/(1+Math.exp(-x)), g=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  /* --- Pix transactions --- */
  const KEYS=['CPF','phone','e-mail','random'];
  function pixTx(fraud){
    const night=fraud?R()<.55:R()<.12, newKey=fraud?R()<.82:R()<.18, young=fraud?R()<.7:R()<.05, dev=fraud?R()<.6:R()<.04, mule=fraud?R()<.58:R()<.01;
    const med=60+R()*400, mult=fraud?Math.exp(1.1+g()*.8):Math.exp(g()*.7-0.2), amt=Math.max(5,Math.round(med*mult));
    const hour=night?(22+Math.floor(R()*8))%24:8+Math.floor(R()*14);
    const f={newKey,young,night,big:mult>5,dev,mule};
    const z=-6.1+2.0*newKey+1.9*young+1.0*night+1.7*(mult>5)+1.8*dev+2.4*mule+g()*0.9;
    return {fraud,amt,hour,mult,key:KEYS[Math.floor(R()*4)],f,score:Math.round(1000*sig(z))};
  }
  const POP=[];for(let i=0;i<24000;i++)POP.push(pixTx(R()<.012));
  /* --- authentication logins --- */
  const HOURS=[...Array(24)].map((_,h)=>h<6?.2:h<8?1.2:h<12?7:h<14?5:h<18?6.5:h<22?5.5:1.4);
  const hs=HOURS.reduce((a,b)=>a+b,0); const HP=HOURS.map(v=>v/hs);
  function authZ(x){
    const hourTerm=Math.max(0,-Math.log(HP[x.hour]*24))*0.55, distTerm=0.75*Math.log10(1+x.km/10), travel=x.travelMin&&x.km/(x.travelMin/60)>900?1.8:0;
    const ip={clean:0,shared:.6,bad:2.1}[x.ip];
    const parts=[[tx('New device','Dispositivo novo'),1.7*x.newDev],[tx('VPN / proxy','VPN / proxy'),1.3*x.proxy],[tx('Failed attempts','Tentativas falhas'),.6*x.fails],[tx('Unusual hour','Horário incomum'),hourTerm],[tx('Distance from usual places','Distância dos locais habituais'),distTerm],[tx('Impossible travel','Viagem impossível'),travel],[tx('IP reputation','Reputação do IP'),ip],[tx('Known device & long history','Dispositivo conhecido & histórico longo'),x.newDev?0:-.9]];
    return {z:-3.6+parts.reduce((a,p)=>a+p[1],0),parts};
  }
  const AUTHPOP=[];for(let i=0;i<30000;i++){const atk=R()<.004;const x={newDev:atk?R()<.85:R()<.06,proxy:atk?R()<.5:R()<.05,fails:atk?Math.floor(R()*4):(R()<.08?1:0),hour:atk?(R()<.5?Math.floor(R()*6):8+Math.floor(R()*14)):(()=>{let r=R(),a=0;for(let h=0;h<24;h++){a+=HP[h];if(r<=a)return h;}return 12;})(),km:atk?Math.exp(3+g()*2):Math.exp(g()*1.2),ip:atk?(R()<.45?'bad':R()<.5?'shared':'clean'):(R()<.12?'shared':'clean'),travelMin:0};
    AUTHPOP.push({atk,score:Math.round(1000*sig(authZ(x).z+g()*.6))});}
  return {sig,pixTx,POP,authZ,HP,AUTHPOP,R};
})();

function scoreGauge(v,label){
  const a=Math.PI*(1-v/1000), cx=110, cy=104, r=86, x=cx+r*Math.cos(a), y=cy-r*Math.sin(a);
  const band=v>=800?'--bad':v>=500?'--down':v>=200?'--f-ds':'--ok';
  const seg=(f,t,c)=>{const a1=Math.PI*(1-f/1000),a2=Math.PI*(1-t/1000);return `<path d="M${cx+r*Math.cos(a1)} ${cy-r*Math.sin(a1)} A${r} ${r} 0 0 1 ${cx+r*Math.cos(a2)} ${cy-r*Math.sin(a2)}" fill="none" stroke="var(${c})" stroke-width="14" opacity=".28"/>`;};
  return `<svg viewBox="0 0 220 124" style="width:100%;max-width:300px" role="img" aria-label="${label} ${v}">${seg(0,200,'--ok')}${seg(200,500,'--f-ds')}${seg(500,800,'--down')}${seg(800,1000,'--bad')}
    <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" style="transition:all .4s"/><circle cx="${cx}" cy="${cy}" r="6" fill="var(--fg)"/>
    <text x="${cx}" y="${cy-30}" text-anchor="middle" font-size="30" font-weight="800" fill="var(${band})" font-family="var(--font)">${v}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--font)">${label}</text>
    <text x="22" y="120" font-size="9" fill="var(--muted)" font-family="var(--font)">0</text><text x="198" y="120" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--font)">1000</text></svg>`;
}
const BANDS=v=>v>=800?['bad',tx('Critical','Crítico'),tx('Block and require full re-authentication','Bloquear e exigir reautenticação completa')]:v>=500?['warn',tx('High','Alto'),tx('Step-up: one-time code + biometrics','Step-up: código único + biometria')]:v>=200?['info',tx('Medium','Médio'),tx('Allow, bind device and monitor the session','Permitir, vincular dispositivo e monitorar a sessão')]:['ok',tx('Low','Baixo'),tx('Allow silently','Permitir sem atrito')];

    const bins=20,H=k=>{const a=Array(bins).fill(0);P.filter(p=>p.atk===k).forEach(p=>a[Math.min(bins-1,Math.floor(p.score/50))]++);const n=a.reduce((x,y)=>x+y,0);return a.map(v=>100*v/n);};

      options:{scales:{y:{title:{display:true,text:tx('% of group','% do grupo')},ticks:{callback:v=>v+'%'}},x:{title:{display:true,text:'score'},grid:{display:false},ticks:{callback:function(v){return v%4===0?this.getLabelForValue(v):'';}}}},plugins:{legend:{display:true,labels:{boxWidth:12}},tooltip:{displayColors:true,callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw,1)}%`}},annot:{v:[{v:st.thr/50-.5,c:cssv('--fg'),dash:[],label:tx('threshold','limiar')}]}}},plugins:[annotPlugin]});

    };

/* ---------------- Pix fraud model ---------------- */
function demoPix(root){
  const st={tab:'live',thr:780,run:true,n:0,app:0,hold:0,blk:0,saved:0,feed:[]};
  const FEAT=[['newKey',tx('Recipient key created < 24 h ago','Chave do recebedor criada há < 24 h')],['young',tx('Recipient account < 30 days old','Conta do recebedor com < 30 dias')],['night',tx('Between 22:00 and 06:00','Entre 22h e 6h')],['big',tx('Amount > 5× payer’s median','Valor > 5× a mediana do pagador')],['dev',tx('Payer device changed in last 24 h','Dispositivo do pagador trocou nas últimas 24 h')],['mule',tx('Recipient got Pix from 5+ payers in 1 h','Recebedor recebeu Pix de 5+ pagadores em 1 h')]];
